
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRE Interativo</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96.1%;
            --secondary-foreground: 222.2 84% 4.9%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --border: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;

            /* Custom DRE Colors */
            --dre-header-bg: #2f3b59;
            --dre-header-text: #ffffff;
            --dre-group-green-bg: #e2f0d9;
            --dre-group-orange-bg: #fff2cc;
            --dre-group-gray-bg: #f2f2f2;
            --dre-positive-text: #38761d;
            --dre-negative-text: #cc0000;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: hsl(var(--secondary));
            color: hsl(var(--foreground));
            font-family: Inter, sans-serif;
        }

        .chevron-icon {
            transition: transform 0.2s ease-in-out;
        }

        .expanded .chevron-icon {
            transform: rotate(90deg);
        }

        .natureza-row {
            display: none;
        }
    </style>
</head>
<body class="h-full w-full p-4 box-border">

    <div id="dre-container" class="w-full h-full bg-white rounded-lg shadow-sm border border-[color:var(--border)] flex flex-col overflow-hidden">
        <div id="table-wrapper" class="flex-grow overflow-auto">
            <table class="w-full text-sm border-collapse">
                <thead id="dre-thead" class="sticky top-0 z-10">
                    <!-- Header will be generated by JS -->
                </thead>
                <tbody id="dre-tbody">
                    <!-- Rows will be generated by JS -->
                </tbody>
                <tfoot id="dre-tfoot" class="sticky bottom-0 z-10">
                    <!-- Footer with totals will be generated by JS -->
                </tfoot>
            </table>
        </div>
        <div id="loading-placeholder" class="w-full h-full flex items-center justify-center text-center p-8">
            <div class="flex items-center space-x-2 text-gray-500">
                <svg class="animate-spin h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Carregando dados do DRE...</span>
            </div>
        </div>
    </div>

    <script>
        const DRE_UPDATE_EVENT_NAME = 'mitra-update-dre-interativo';

        function updateMitra() {
            document.body.dispatchEvent(new CustomEvent(DRE_UPDATE_EVENT_NAME));
        }

        document.addEventListener('DOMContentLoaded', () => {
            const tbody = document.getElementById('dre-tbody');
            const thead = document.getElementById('dre-thead');
            const tfoot = document.getElementById('dre-tfoot');
            const loadingPlaceholder = document.getElementById('loading-placeholder');
            const tableWrapper = document.getElementById('table-wrapper');
            const naturezasCache = new Map();

            const formatCurrency = (value) => {
                const num = parseFloat(value);
                if (isNaN(num)) {
                    return '-';
                }
                const formatted = new Intl.NumberFormat('pt-BR', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(Math.abs(num));
                
                if (num < 0) {
                    return `<span class="text-[color:var(--dre-negative-text)]">-${formatted}</span>`;
                }
                if (num > 0) {
                     return `<span class="text-[color:var(--dre-positive-text)]">${formatted}</span>`;
                }
                return '0,00';
            };
            
            const getGroupRowStyle = (descAgrup) => {
                if (!descAgrup) return 'bg-[color:var(--dre-group-gray-bg)]';
                const upperDesc = descAgrup.toUpperCase();
                if (upperDesc.includes('RECEITA')) return 'bg-[color:var(--dre-group-green-bg)]';
                if (upperDesc.includes('CUSTOS') || upperDesc.includes('DESPESAS') || upperDesc.includes('FINANCEIRA')) return 'bg-[color:var(--dre-group-orange-bg)]';
                return 'bg-[color:var(--dre-group-gray-bg)]';
            };

            const generatePivotClause = (startStr, endStr) => {
                if (!startStr || !endStr) return { accumulatedSql: '', pivotSql: '', monthHeaders: [] };
                
                let startDate = new Date(startStr.substring(0, 10) + 'T00:00:00');
                let endDate = new Date(endStr.substring(0, 10) + 'T00:00:00');

                if (isNaN(startDate.getTime()) || isNaN(endDate.getTime())) {
                     console.error("Datas inválidas para o pivô:", startStr, endStr);
                     return { accumulatedSql: '', pivotSql: '', monthHeaders: [] };
                }

                let pivotClauses = [];
                let monthHeaders = [];
                let currentDate = new Date(startDate.getFullYear(), startDate.getMonth(), 1);

                while (currentDate <= endDate) {
                    const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                    const year = currentDate.getFullYear();
                    const monthYear = `${month}/${year}`;
                    const monthName = currentDate.toLocaleString('pt-BR', { month: 'short' }).toUpperCase();
                    
                    pivotClauses.push(
                        `SUM(CASE WHEN TO_CHAR(D.DTNEG, 'MM/YYYY') = '${monthYear}' THEN (D.VALOR * D.RECDESP) ELSE 0 END) AS "${monthName.replace('.','')}"`
                    );
                    monthHeaders.push(monthName.replace('.',''));

                    currentDate.setMonth(currentDate.getMonth() + 1);
                }

                return {
                    accumulatedSql: ', SUM(D.VALOR * D.RECDESP) AS ACUMULADO',
                    pivotSql: pivotClauses.length > 0 ? `, ${pivotClauses.join(', ')}` : '',
                    monthHeaders: monthHeaders
                };
            };
            
            const renderFooter = (result) => {
                tfoot.innerHTML = '';
                if (!result.data || result.data.length === 0) return;

                const headers = result.headers.map(h => h.name);
                const dynamicHeaders = headers.slice(3); // Start after CODIGO, DESCAGRUP, ACUMULADO
                const colMap = {};
                headers.forEach((h, i) => colMap[h.toUpperCase()] = i);
                
                const totals = {
                    receitaLiquida: { ACUMULADO: 0 },
                    custosMercadorias: { ACUMULADO: 0 },
                    despesasOperacionais: { ACUMULADO: 0 },
                    financeiraLiquida: { ACUMULADO: 0 },
                    margemContribuicao: { ACUMULADO: 0 },
                    lucroOperacional: { ACUMULADO: 0 },
                    totalizado: { ACUMULADO: 0 }
                };

                const tempCodAgrup1 = { ACUMULADO: 0 };
                const tempCodAgrup2 = { ACUMULADO: 0 };

                dynamicHeaders.forEach(h => {
                    totals.receitaLiquida[h] = 0;
                    totals.custosMercadorias[h] = 0;
                    totals.despesasOperacionais[h] = 0;
                    totals.financeiraLiquida[h] = 0;
                    totals.lucroOperacional[h] = 0; // Initialize monthly totals for lucroOperacional
                    tempCodAgrup1[h] = 0;
                    tempCodAgrup2[h] = 0;
                });
                
                result.data.forEach(row => {
                    const descAgrup = (row[colMap['DESCAGRUP']] || '').toUpperCase();
                    const codAgrup = (row[colMap['CODAGRUP']] || '').toString();
                    const codAgrupInt = parseInt(codAgrup, 10);

                    // NEW LOGIC: Direct summation for Lucro Operacional (1-11)
                    if (!isNaN(codAgrupInt) && codAgrupInt >= 1 && codAgrupInt <= 11) {
                        totals.lucroOperacional.ACUMULADO += parseFloat(row[colMap['ACUMULADO']]) || 0;
                        dynamicHeaders.forEach(h => {
                            totals.lucroOperacional[h] += parseFloat(row[colMap[h.toUpperCase()]]) || 0;
                        });
                    }

                    // OLD LOGIC (kept for other totals)
                    if (codAgrup === '1') {
                         tempCodAgrup1.ACUMULADO += parseFloat(row[colMap['ACUMULADO']]) || 0;
                         dynamicHeaders.forEach(h => {
                            tempCodAgrup1[h] += parseFloat(row[colMap[h.toUpperCase()]]) || 0;
                        });
                    } else if (codAgrup === '2') {
                         tempCodAgrup2.ACUMULADO += parseFloat(row[colMap['ACUMULADO']]) || 0;
                         dynamicHeaders.forEach(h => {
                            tempCodAgrup2[h] += parseFloat(row[colMap[h.toUpperCase()]]) || 0;
                        });
                    } else if (['6', '7', '8', '9'].includes(codAgrup)) {
                         totals.despesasOperacionais.ACUMULADO += parseFloat(row[colMap['ACUMULADO']]) || 0;
                         dynamicHeaders.forEach(h => {
                            totals.despesasOperacionais[h] += parseFloat(row[colMap[h.toUpperCase()]]) || 0;
                        });
                    } else if (['10', '11'].includes(codAgrup)) {
                        totals.financeiraLiquida.ACUMULADO += parseFloat(row[colMap['ACUMULADO']]) || 0;
                        dynamicHeaders.forEach(h => {
                           totals.financeiraLiquida[h] += parseFloat(row[colMap[h.toUpperCase()]]) || 0;
                       });
                    } else if (descAgrup.includes('CUSTOS') || descAgrup.includes('DESPESAS')) {
                        totals.custosMercadorias.ACUMULADO += parseFloat(row[colMap['ACUMULADO']]) || 0;
                        dynamicHeaders.forEach(h => {
                            totals.custosMercadorias[h] += parseFloat(row[colMap[h.toUpperCase()]]) || 0;
                        });
                    }
                });

                totals.receitaLiquida.ACUMULADO = tempCodAgrup1.ACUMULADO + tempCodAgrup2.ACUMULADO;
                dynamicHeaders.forEach(h => {
                    totals.receitaLiquida[h] = tempCodAgrup1[h] + tempCodAgrup2[h];
                });
                
                const margemAcumulado = totals.receitaLiquida.ACUMULADO + totals.custosMercadorias.ACUMULADO;
                totals.margemContribuicao.ACUMULADO = margemAcumulado;

                // Set totalizado to the new calculated lucroOperacional
                totals.totalizado.ACUMULADO = totals.lucroOperacional.ACUMULADO;

                dynamicHeaders.forEach(h => {
                    const margem = totals.receitaLiquida[h] + totals.custosMercadorias[h];
                    totals.margemContribuicao[h] = margem;
                    
                    // Set monthly totalizado to the new calculated lucroOperacional
                    totals.totalizado[h] = totals.lucroOperacional[h];
                });

                const createTotalRow = (code, label, data) => {
                    let html = `<tr class="bg-blue-200 text-blue-900 font-bold">`;
                    html += `<td class="px-4 py-2">${code}</td>`;
                    html += `<td class="px-4 py-2">${label}</td>`;
                    html += `<td class="px-4 py-2 text-right">${formatCurrency(data.ACUMULADO)}</td>`;
                    dynamicHeaders.forEach(h => {
                        html += `<td class="px-4 py-2 text-right">${formatCurrency(data[h])}</td>`;
                    });
                    html += `</tr>`;
                    return html;
                };

                let footerHtml = '';
                footerHtml += createTotalRow('100', 'RECEITA LIQUIDA', totals.receitaLiquida);
                footerHtml += createTotalRow('110', 'CUSTOS MERCADORIAS', totals.custosMercadorias);
                footerHtml += createTotalRow('120', 'MARGEM DE CONTRIBUIÇÃO', totals.margemContribuicao);
                footerHtml += createTotalRow('130', 'DESPESAS OPERACIONAIS', totals.despesasOperacionais);
                footerHtml += createTotalRow('150', 'LUCRO OPERACIONAL', totals.lucroOperacional);
                footerHtml += createTotalRow('140', 'FINANCEIRA LIQUIDA', totals.financeiraLiquida);
                footerHtml += createTotalRow('999999', 'TOTALIZADO', totals.totalizado);

                tfoot.innerHTML = footerHtml;
            };

            const renderTable = (result) => {
                thead.innerHTML = '';
                tbody.innerHTML = '';
                
                const headers = result.headers.map(h => h.name);
                const colMap = {};
                headers.forEach((h, i) => colMap[h.toUpperCase()] = i);

                let headerHtml = '<tr>';
                headerHtml += `<th class="px-4 py-3 text-left font-semibold text-[color:var(--dre-header-text)] bg-[color:var(--dre-header-bg)] w-24">CÓDIGO</th>`;
                headerHtml += `<th class="px-4 py-3 text-left font-semibold text-[color:var(--dre-header-text)] bg-[color:var(--dre-header-bg)] min-w-[250px]">NATUREZA</th>`;
                headerHtml += `<th class="px-4 py-3 text-right font-semibold text-[color:var(--dre-header-text)] bg-[color:var(--dre-header-bg)] min-w-[120px]">ACUMULADO</th>`;

                const dynamicHeaders = headers.slice(3); // Start after CODIGO, DESCAGRUP, ACUMULADO
                dynamicHeaders.forEach(header => {
                    headerHtml += `<th class="px-4 py-3 text-right font-semibold text-[color:var(--dre-header-text)] bg-[color:var(--dre-header-bg)] min-w-[120px]">${header}</th>`;
                });
                headerHtml += '</tr>';
                thead.innerHTML = headerHtml;

                if (!result.data || result.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="${headers.length}" class="text-center p-8 text-gray-500">Nenhum dado encontrado para o período selecionado.</td></tr>`;
                    tfoot.innerHTML = '';
                    return;
                }

                let bodyHtml = '';
                result.data.forEach(row => {
                    const codAgrup = row[colMap['CODAGRUP']];
                    const descAgrup = row[colMap['DESCAGRUP']];
                    const rowStyle = getGroupRowStyle(descAgrup);
                    const isExpandable = codAgrup != null;
                    
                    bodyHtml += `<tr class="${isExpandable ? 'group-row cursor-pointer hover:opacity-80' : ''} border-b border-gray-200 font-bold ${rowStyle}" ${isExpandable ? `data-codagrup="${codAgrup}"` : ''} data-loaded="false" data-expanded="false">`;
                    bodyHtml += `<td class="px-4 py-2">${codAgrup || ''}</td>`;
                    bodyHtml += `<td class="px-4 py-2 flex items-center space-x-2">
                                    ${isExpandable ? '<svg class="chevron-icon w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>' : '<div class="w-4 h-4"></div>'}
                                    <span>${descAgrup || 'Sem Agrupamento'}</span>
                                </td>`;
                    
                    bodyHtml += `<td class="px-4 py-2 text-right">${formatCurrency(row[colMap['ACUMULADO']])}</td>`;

                    dynamicHeaders.forEach(header => {
                        const value = row[colMap[header.toUpperCase()]];
                        bodyHtml += `<td class="px-4 py-2 text-right">${formatCurrency(value)}</td>`;
                    });
                    
                    bodyHtml += `</tr>`;
                });
                tbody.innerHTML = bodyHtml;
            };

            const toggleGroup = async (groupRow) => {
                const codAgrup = groupRow.dataset.codagrup;
                if (!codAgrup || codAgrup === 'null') {
                    return;
                }
                const isLoaded = groupRow.dataset.loaded === 'true';
                const isExpanded = groupRow.dataset.expanded === 'true';

                const childRows = tbody.querySelectorAll(`.natureza-row[data-parent-agrup="${codAgrup}"]`);
                
                if (isExpanded) {
                    childRows.forEach(row => row.style.display = 'none');
                    groupRow.dataset.expanded = 'false';
                    groupRow.classList.remove('expanded');
                } else {
                    if (isLoaded) {
                        childRows.forEach(row => row.style.display = 'table-row');
                        groupRow.dataset.expanded = 'true';
                        groupRow.classList.add('expanded');
                    } else {
                        groupRow.dataset.loaded = 'true';
                        
                        try {
                             await setVariableMitra({ name: componentData.varCodAgrup, content: codAgrup.toString() });
                             
                            const { accumulatedSql, pivotSql } = await getPivotData();
                            const finalQuery = componentData.queryNaturezas.replace('/*, [SUM(CASE WHEN...)] AS MES_1, [SUM(CASE WHEN...)] AS MES_2 ... */', accumulatedSql + pivotSql);
                            
                            const result = await queryMitra({ 
                                query: finalQuery, 
                                jdbcId: parseInt(componentData.jdbcId, 10) 
                            });
                            
                            naturezasCache.set(codAgrup, result);

                            const headers = result.headers.map(h => h.name);
                            const dynamicHeaders = headers.slice(3); // CODNAT, DESCRNAT, ACUMULADO
                            const colMap = {};
                            headers.forEach((h, i) => colMap[h.toUpperCase()] = i);
                            
                            const fragment = document.createDocumentFragment();
                            result.data.forEach(row => {
                                const newRow = document.createElement('tr');
                                newRow.className = `natureza-row border-b border-gray-200`;
                                newRow.dataset.parentAgrup = codAgrup;
                                newRow.style.display = 'table-row';

                                let rowHtml = `<td class="px-4 py-2 text-gray-500">${row[colMap['CODNAT']]}</td>`;
                                rowHtml += `<td class="pl-12 pr-4 py-2 text-gray-700">
                                    <div class="flex items-center justify-between">
                                        <span>${row[colMap['DESCRNAT']]}</span>
                                        <span class="details-icon cursor-pointer text-gray-400 hover:text-blue-600" data-codnat="${row[colMap['CODNAT']]}">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                        </span>
                                    </div>
                                </td>`;
                                rowHtml += `<td class="px-4 py-2 text-right">${formatCurrency(row[colMap['ACUMULADO']])}</td>`;
                                dynamicHeaders.forEach(header => {
                                    rowHtml += `<td class="px-4 py-2 text-right">${formatCurrency(row[colMap[header.toUpperCase()]])}</td>`;
                                });
                                newRow.innerHTML = rowHtml;
                                fragment.appendChild(newRow);
                            });
                            
                            groupRow.after(fragment);
                            groupRow.dataset.expanded = 'true';
                            groupRow.classList.add('expanded');

                        } catch(error) {
                            console.error(`Falha ao carregar naturezas para o grupo ${codAgrup}:`, error);
                            groupRow.dataset.loaded = 'false';
                            const errorRow = document.createElement('tr');
                            errorRow.className = `natureza-row`;
                            errorRow.dataset.parentAgrup = codAgrup;
                            errorRow.innerHTML = `<td colspan="99" class="text-center p-4 text-red-600 bg-red-50">Erro ao carregar detalhes.</td>`;
                            groupRow.after(errorRow);
                            setTimeout(() => errorRow.remove(), 3000);
                        }
                    }
                }
            };
            
            tbody.addEventListener('click', async (e) => {
                const detailsIcon = e.target.closest('.details-icon');
                if (detailsIcon) {
                    const codNat = detailsIcon.dataset.codnat;
                    if (codNat) {
                        try {
                            await setVariableMitra({ name: ':VAR_DRE_NATUREZA_ID', content: codNat });
                            modalMitra({ id: 92, width: 80, height: 90, title: 'Detalhes dos Títulos' });
                        } catch (error) {
                            console.error('Erro ao abrir modal de detalhes:', error);
                        }
                    }
                }
                
                const groupRow = e.target.closest('.group-row');
                if (groupRow && !detailsIcon) { 
                    toggleGroup(groupRow);
                }
            });
            
            const getPivotData = async () => {
                const dateRes = await queryMitra({query: "SELECT :VAR_DRE_DT_INI, :VAR_DRE_DT_FIM FROM DUAL", jdbcId: parseInt(componentData.jdbcId, 10)});
                const [startDate, endDate] = dateRes.data[0];
                return generatePivotClause(startDate, endDate);
            };

            const initializeComponent = async () => {
                try {
                    tableWrapper.style.display = 'none';
                    loadingPlaceholder.style.display = 'flex';
                    naturezasCache.clear();
                    
                    const { accumulatedSql, pivotSql } = await getPivotData();
                    const finalQuery = componentData.queryAgrupadores.replace('/*, [SUM(CASE WHEN...)] AS MES_1, [SUM(CASE WHEN...)] AS MES_2 ... */', accumulatedSql + pivotSql);

                    const result = await queryMitra({
                        query: finalQuery,
                        jdbcId: parseInt(componentData.jdbcId, 10)
                    });

                    renderTable(result);
                    renderFooter(result);

                } catch (error) {
                    console.error("Erro fatal ao inicializar o DRE:", error);
                    thead.innerHTML = '';
                    tbody.innerHTML = `<tr><td colspan="2" class="p-8 text-center text-red-700 bg-red-50">Ocorreu um erro crítico ao carregar os dados. Verifique a configuração e o console para mais detalhes.</td></tr>`;
                    tfoot.innerHTML = '';
                } finally {
                    loadingPlaceholder.style.display = 'none';
                    tableWrapper.style.display = 'block';
                }
            };

            document.body.addEventListener(DRE_UPDATE_EVENT_NAME, initializeComponent);

            const waitForMitraAndInit = () => {
                const maxWaitTime = 5000;
                const intervalTime = 100;
                const startTime = Date.now();
                const checkInterval = setInterval(() => {
                    if (window.componentData && window.componentData.queryAgrupadores) {
                        clearInterval(checkInterval);
                        initializeComponent();
                    } else if (Date.now() - startTime > maxWaitTime) {
                        clearInterval(checkInterval);
                        console.error("Erro: As configurações do componente (componentData) não foram carregadas a tempo.");
                        document.body.innerHTML = `<div class="p-8 text-center text-red-700 bg-red-50 h-full flex items-center justify-center">Erro Crítico: As configurações do componente não foram carregadas da plataforma.</div>`;
                    }
                }, intervalTime);
            };

            waitForMitraAndInit();
        });
    </script>
</body>
</html>
