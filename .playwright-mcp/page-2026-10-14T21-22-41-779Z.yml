        - generic [ref=f6e113]:
          - generic [ref=f6e114]:
            - paragraph [ref=f6e116]: "Você aciona o SQL/BI Expert quando o problema exige SQL como parte de uma solução analítica: escrever ou revisar consultas, avaliar portabilidade, interpretar construções específicas do banco e separar uma decisão de modelagem de uma decisão de sintaxe. O ponto de partida dele é SQL ANSI; Oracle, SQL Server e PostgreSQL entram quando o ambiente exige comportamento específico. A documentação-base do expert adota exatamente essa ordem: ANSI primeiro, funções compatíveis depois e extensões proprietárias quando houver justificativa."
            - generic [ref=f6e117]:
              - heading "O banco faz parte da pergunta" [level=3] [ref=f6e118]
              - paragraph [ref=f6e119]: Não entregue apenas "esta query está errada". Informe qual SGBD executará a consulta. Uma construção válida em Oracle pode não ser portátil para SQL Server ou PostgreSQL.
