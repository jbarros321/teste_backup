                - code [ref=f6e125]: TOP
                - text: ","
                - code [ref=f6e126]: APPLY
                - text: ","
                - code [ref=f6e127]: PIVOT
                - text: ","
                - code [ref=f6e128]: TRY_CAST
                - text: ","
