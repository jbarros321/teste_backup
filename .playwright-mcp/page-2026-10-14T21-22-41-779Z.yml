                - code [ref=f6e132]: JSONB
                - text: ", além de CTEs, Window Functions e materialized views. A presença de uma função proprietária não torna a consulta ruim; torna a dependência do banco explícita."
              - paragraph [ref=f6e133]:
                - text: Um exemplo oficial do próprio Construtor de Dashboards usa
