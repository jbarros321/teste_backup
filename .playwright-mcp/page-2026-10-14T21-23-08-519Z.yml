        - 'heading "Anatomia do ecossistema: gateway, orquestrador e 26 especialistas" [level=2] [ref=f8e111]'
        - generic [ref=f8e112]:
          - generic [ref=f8e113]:
            - paragraph [ref=f8e115]: "Você não opera o SEA como uma coleção de respostas isoladas. Você entra por uma camada transversal que recebe a demanda, preserva contexto, identifica os domínios envolvidos, verifica evidências e decide até onde consegue responder horizontalmente antes de recomendar aprofundamento especializado. Essa camada é o SEA Generalist: inteligência horizontal especializada no ecossistema Sankhya."
            - generic [ref=f8e116]:
              - heading "Gateway, orquestração e especialização" [level=3] [ref=f8e117]
              - paragraph [ref=f8e118]: Pense em três responsabilidades diferentes.
              - paragraph [ref=f8e119]: "O gateway representa a entrada: sua demanda precisa chegar com objetivo e contexto suficientes para ser compreendida."
              - paragraph [ref=f8e120]: O orquestrador classifica a demanda, identifica dependências e decide qual conhecimento precisa participar.
              - paragraph [ref=f8e121]: Os especialistas aprofundam domínios quando a análise horizontal deixa de ser suficiente.
              - paragraph [ref=f8e122]: O Generalist atua principalmente na segunda responsabilidade e na análise transversal. Uma pergunta como "o pedido foi confirmado, mas não gerou financeiro" não pertence automaticamente a um único domínio. O expert pode precisar correlacionar documento comercial, TOP, versão histórica da TOP, runtime e financeiro. O documento comercial possui uma identidade como NUNOTA; o financeiro possui sua própria identidade, NUFIN. A ausência de NUFIN é evidência muito mais forte de que o título não foi gerado do que simplesmente "não apareceu na tela".
            - generic [ref=f8e123]:
              - heading "Onde o Generalist para" [level=3] [ref=f8e124]
              - paragraph [ref=f8e125]: A IA cobre horizontalmente processos funcionais, estruturas de dados, APIs, integrações, SDK, banco, estoque, financeiro, fiscal, segurança, runtime, troubleshooting e arquitetura. A função dela é correlacionar essas camadas, encontrar a primeira divergência entre estado esperado e observado e orientar a validação.
              - paragraph [ref=f8e126]: "Quando a demanda exige profundidade vertical — por exemplo, desenho tributário formal, investigação profunda de WMS ou revisão especializada de uma customização Java — o Generalist preserva o diagnóstico transversal e encaminha o aprofundamento. Não descarte o que veio antes: o encaminhamento deve levar contexto, evidências e hipóteses já construídas."
