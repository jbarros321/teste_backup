<ion-side-menus enable-menu-with-back-views="true">

    <ion-side-menu-content class="dark-menu-content">
	    <ion-header-bar style="padding: 0px; display: block; background-image: none;">
	      		<div style="width : 100%; height: 22px; background: black;margin-top: 0px !important;"></div>
	      		<div style="width : 100%; height: 2px; background: white;margin-top: 0px !important;"></div>
	      		<div style="width : 100%; height: 5px; background: #D85904;margin-top: 0px !important;"></div>
    	</ion-header-bar>
        <ion-nav-bar id="navBar" align-title="left" class="bar-orange">
            <ion-nav-buttons side="left">
                <button class="button button-icon ion-navicon" menu-toggle="left" ng-show="showSideMenuButton">
                </button>
            </ion-nav-buttons>
        </ion-nav-bar>
        <ion-nav-view name="content"></ion-nav-view>
        <ion-footer-bar name="footer"" align-title="left" class="bg_rodape-img" ng-if="windowHeightKeyboard >= 480">
            <div style="width: 100%; height: 100%; position: relative;">
                <div style="position: absolute; bottom 0px;" class="lg_rodape-img"></div>
            </div>            
        </ion-footer-bar>
    </ion-side-menu-content>

    <ion-side-menu side="left" class="dark-menu">
        <ion-content>
            <ul class="list">
                <a class="item item-icon-left" style="width: 100%;" href="#" ng-click="doLogout()">
                    <i class="icon ion-android-arrow-back"></i>
                    Sair
                </a>
            </ul>
        </ion-content>
    </ion-side-menu>
</ion-side-menus>
