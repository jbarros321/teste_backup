<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indicadores de Armazenagem — VILOG</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        :root {
            /* Paleta categórica validada (CVD-safe, sem roxo) */
            --s1: #2a78d6;   /* azul       */
            --s2: #16a37a;   /* verde      */
            --s3: #eda100;   /* âmbar      */
            --s4: #e34948;   /* vermelho   */
            --s5: #e87ba4;   /* magenta    */
            --s6: #eb6834;   /* laranja    */

            --brand: #16a37a;
            --brand-dark: #0d7f5f;
            --brand-soft: #e6f6f0;

            --bg: #f4f6fa;
            --surface: #ffffff;
            --ink: #16233a;
            --ink-2: #4a5872;
            --ink-3: #8b96ab;
            --line: #e4e9f2;
            --line-soft: #eef1f7;

            --shadow: 0 1px 2px rgba(22, 35, 58, 0.05), 0 6px 20px rgba(22, 35, 58, 0.05);
            --shadow-hover: 0 2px 6px rgba(22, 35, 58, 0.07), 0 14px 34px rgba(22, 35, 58, 0.08);
            --radius: 14px;
            --radius-sm: 9px;
            --font: 'DM Sans', system-ui, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            font-family: var(--font);
            color: var(--ink);
            min-height: 100vh;
        }

        /* ── LOADER ── */
        .loader-container {
            display: flex; align-items: center; justify-content: center;
            min-height: 60vh; flex-direction: column; gap: 14px;
            color: var(--ink-3); font-size: 14px; font-weight: 500;
        }
        .loader {
            width: 42px; height: 42px;
            border: 3px solid var(--line);
            border-bottom-color: var(--brand);
            border-radius: 50%;
            animation: rotation 0.9s linear infinite;
        }
        @keyframes rotation { to { transform: rotate(360deg); } }

        /* ── TOP BAR (marca + filtros) ── */
        .topbar {
            background: var(--surface);
            border-bottom: 1px solid var(--line-soft);
            padding: 14px 28px;
            display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap;
            position: sticky; top: 0; z-index: 50;
            box-shadow: 0 1px 0 var(--line-soft), 0 4px 18px rgba(22, 35, 58, 0.04);
        }
        .brand { display: flex; flex-direction: column; gap: 1px; margin-right: 10px; padding-bottom: 1px; }
        .brand-name {
            font-weight: 700; font-size: 16px; letter-spacing: -0.02em; color: var(--ink);
            display: flex; align-items: center; gap: 7px;
        }
        .brand-name .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--brand); display: inline-block; }
        .brand-sub { font-size: 11px; color: var(--ink-3); font-weight: 500; }

        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-label {
            font-size: 10.5px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--ink-3);
        }
        .filter-input, .filter-select {
            font-family: var(--font); font-size: 13px; font-weight: 500; color: var(--ink);
            background: var(--bg); border: 1.5px solid var(--line);
            border-radius: var(--radius-sm); padding: 7px 12px; min-width: 150px;
            transition: border-color .18s, box-shadow .18s, background .18s;
            outline: none; -webkit-appearance: none; appearance: none;
        }
        .filter-select {
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 12 12' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M2.5 4.5L6 8L9.5 4.5' stroke='%238b96ab' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat; background-position: right 10px center; padding-right: 30px;
        }
        .filter-input:focus, .filter-select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(22, 163, 122, 0.15);
            background: var(--surface);
        }
        .topbar-meta { margin-left: auto; font-size: 11.5px; color: var(--ink-3); padding-bottom: 8px; font-weight: 500; }

        /* ── LAYOUT ── */
        .content {
            padding: 24px 28px 40px;
            display: flex; flex-direction: column; gap: 24px;
            max-width: 1640px; margin: 0 auto;
        }

        .section-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--ink-3);
            display: flex; align-items: center; gap: 9px; margin-bottom: -10px;
        }
        .section-label::before {
            content: ''; width: 18px; height: 3px; border-radius: 3px; background: var(--brand);
        }

        /* ── CARDS ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: box-shadow .22s;
        }
        .card:hover { box-shadow: var(--shadow-hover); }
        .card-inner { padding: 20px 22px; }
        .card-title { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; }
        .card-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

        /* ── KPI TILES ── */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
            gap: 14px;
        }
        .kpi {
            background: var(--surface);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 18px;
            display: flex; flex-direction: column; gap: 12px;
            position: relative; overflow: hidden;
            transition: box-shadow .2s, transform .2s;
        }
        .kpi:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
        .kpi::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--kpi-accent, var(--brand));
        }
        .kpi-head { display: flex; align-items: center; gap: 9px; }
        .kpi-chip {
            width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--kpi-chip-bg, var(--brand-soft));
            color: var(--kpi-accent, var(--brand));
        }
        .kpi-title {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--ink-2); line-height: 1.3;
        }
        .kpi-value {
            font-size: 25px; font-weight: 700; letter-spacing: -0.03em; line-height: 1;
            font-feature-settings: "tnum"; color: var(--ink);
        }
        .kpi-unit { font-size: 13px; font-weight: 600; color: var(--ink-3); margin-left: 3px; }
        .kpi-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 5px; }

        .kpi.kpi-hero { background: linear-gradient(160deg, #f0faf6 0%, #ffffff 55%); }
        .kpi.kpi-hero .kpi-value { color: var(--brand-dark); font-size: 27px; }

        /* ── CRITÉRIOS (cards) ── */
        .grid-criterios {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
            gap: 12px;
        }
        .criterio-card {
            background: var(--surface);
            border: 1px solid var(--line-soft);
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow);
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; gap: 10px; justify-content: space-between;
            transition: box-shadow .2s, transform .2s;
        }
        .criterio-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
        .criterio-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: var(--brand); border-radius: 3px 0 0 3px;
        }
        .criterio-name {
            font-size: 12.5px; font-weight: 600; color: var(--ink-2); line-height: 1.35;
            display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .criterio-value {
            font-size: 20px; font-weight: 700; color: var(--ink);
            letter-spacing: -0.02em; font-feature-settings: "tnum";
        }
        .criterio-share {
            font-size: 11px; font-weight: 600; color: var(--brand-dark);
            background: var(--brand-soft); border-radius: 20px; padding: 2px 9px;
            align-self: flex-start;
        }

        /* ── TABELA ── */
        .table-scroll { overflow: auto; max-height: 430px; border-radius: 0 0 var(--radius) var(--radius); }
        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .data-table thead th {
            font-size: 10.5px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.07em; color: var(--ink-3);
            padding: 10px 16px; background: #f8fafc;
            border-bottom: 1.5px solid var(--line);
            position: sticky; top: 0; z-index: 2; text-align: right;
        }
        .data-table thead th:first-child { text-align: left; }
        .data-table tbody td {
            padding: 10px 16px; font-size: 12.5px;
            border-bottom: 1px solid var(--line-soft);
            text-align: right; font-feature-settings: "tnum"; color: var(--ink-2);
        }
        .data-table tbody td:first-child { text-align: left; }
        .data-table tbody tr:hover { background: #f6f9fc; }
        .data-table tfoot td {
            padding: 11px 16px; font-size: 12.5px; font-weight: 700;
            border-top: 2px solid var(--line); background: #f8fafc;
            text-align: right; font-feature-settings: "tnum";
            position: sticky; bottom: 0;
        }
        .data-table tfoot td:first-child { text-align: left; }
        .num-pos { color: var(--brand-dark); font-weight: 600; }
        .num-neg { color: #c73635; font-weight: 600; }
        .num-strong { color: var(--ink); font-weight: 700; }
        .product-name { font-weight: 600; color: var(--ink); font-size: 12.5px; }

        .table-tools { display: flex; align-items: center; gap: 10px; }
        .table-search {
            font-family: var(--font); font-size: 12.5px; color: var(--ink);
            border: 1.5px solid var(--line); border-radius: var(--radius-sm);
            padding: 6px 12px; width: 220px; outline: none; background: var(--bg);
        }
        .table-search:focus { border-color: var(--brand); background: var(--surface); }

        /* ── LEGENDAS ── */
        .viz-legend { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; width: 100%; }
        .viz-legend-item {
            display: flex; align-items: center; gap: 8px;
            font-size: 12px; color: var(--ink-2); font-weight: 500;
        }
        .viz-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
        .viz-legend-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .viz-legend-val { font-feature-settings: "tnum"; color: var(--ink); font-weight: 600; }
        .viz-legend-pct { font-feature-settings: "tnum"; color: var(--ink-3); width: 44px; text-align: right; }

        /* ── GRIDS ── */
        .grid-2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; }
        .grid-2-even { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .chart-wrap { position: relative; }
        .empty-state {
            display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
            min-height: 180px; color: var(--ink-3); font-size: 13px; font-weight: 500; text-align: center;
        }
        .empty-state svg { opacity: .45; }

        @media (max-width: 1100px) {
            .grid-2, .grid-2-even { grid-template-columns: 1fr; }
        }
        @media (max-width: 700px) {
            .content { padding: 16px 16px 32px; gap: 16px; }
            .topbar { padding: 12px 16px; }
            .kpi-grid { grid-template-columns: 1fr 1fr; }
        }

        select, input[type="date"] { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    </style>
</head>

<body>

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="brand">
            <div class="brand-name"><span class="dot"></span>VILOG</div>
            <div class="brand-sub">Indicadores de Armazenagem</div>
        </div>
        <div class="filter-group">
            <label for="data-inicial" class="filter-label">Data Inicial</label>
            <input id="data-inicial" type="date" class="filter-input">
        </div>
        <div class="filter-group">
            <label for="data-final" class="filter-label">Data Final</label>
            <input id="data-final" type="date" class="filter-input">
        </div>
        <div class="filter-group">
            <label for="filtro-parceiro" class="filter-label">Parceiro</label>
            <select id="filtro-parceiro" class="filter-select" style="min-width:200px">
                <option value="all">Todos os parceiros</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="filtro-tipo" class="filter-label">Tipo de Armazenagem</label>
            <select id="filtro-tipo" class="filter-select" style="min-width:200px">
                <option value="all">Todos os tipos</option>
            </select>
        </div>
        <div class="topbar-meta" id="topbar-meta"></div>
    </div>

    <!-- MAIN CONTENT -->
    <main id="dashboard-content" class="content">
        <div class="loader-container">
            <div class="loader"></div>
            <p>Carregando indicadores...</p>
        </div>
    </main>


    <script>
        const MITRA_UPDATE_EVENT_NAME = 'mitra-update-dashboard-armazenagem-v3';

        function updateMitra() {
            document.body.dispatchEvent(new CustomEvent(MITRA_UPDATE_EVENT_NAME));
        }

        document.addEventListener('DOMContentLoaded', () => {

            const contentContainer = document.getElementById('dashboard-content');
            const charts = {};

            // Paleta categórica validada (ordem fixa, CVD-safe, sem roxo)
            const PALETTE = ['#2a78d6', '#16a37a', '#eda100', '#e34948', '#e87ba4', '#eb6834'];
            const INK = '#16233a', INK3 = '#8b96ab', GRID = '#edf1f7';

            const initialHtmlContent = `<div class="loader-container"><div class="loader"></div><p>Carregando indicadores...</p></div>`;
            const errorHtmlContent = `<div style="display:flex;align-items:center;justify-content:center;min-height:50vh;"><div style="background:#fdf1f1;border:1.5px solid #f3c4c4;border-radius:14px;padding:32px 40px;text-align:center;color:#b03432;"><strong style="font-size:16px">Erro ao Carregar Dados</strong><p style="margin-top:8px;font-size:13px;opacity:.85">Verifique as queries e a conexão com o servidor.</p></div></div>`;

            const emptyState = (msg = 'Sem dados para os filtros selecionados') => `
                <div class="empty-state">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path stroke="#8b96ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path stroke="#8b96ab" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>
                    <span>${msg}</span>
                </div>`;

            const dashboardHtmlStructure = `
      <!-- KPIs -->
      <div id="kpi-container" class="kpi-grid"></div>

      <!-- Custos: evolução + composição -->
      <div class="section-label">Análise de Custos</div>
      <div class="grid-2">
        <div class="card">
          <div class="card-inner">
            <div class="card-title">Evolução do Custo Projetado</div>
            <div class="card-sub">Custo mensal estimado pelos critérios de cobrança</div>
            <div class="chart-wrap" id="wrap-line" style="margin-top:18px;height:250px"><canvas id="line-chart"></canvas></div>
          </div>
        </div>
        <div class="card">
          <div class="card-inner">
            <div class="card-title">Composição por Tipo de Armazenagem</div>
            <div class="card-sub">Participação de cada tipo no custo do período</div>
            <div id="wrap-donut" style="display:flex;flex-direction:column;align-items:center;margin-top:14px">
              <div style="height:180px;width:180px;position:relative"><canvas id="donut-chart"></canvas></div>
              <div id="donut-legend" class="viz-legend"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Critérios -->
      <div class="section-label">Critérios de Cobrança</div>
      <div id="criterios-grid" class="grid-criterios"></div>
      <div class="grid-2">
        <div class="card">
          <div class="card-inner">
            <div class="card-title">Custo por Critério</div>
            <div class="card-sub">Valor total de cada critério no período</div>
            <div class="chart-wrap" id="wrap-bar-criterios" style="margin-top:18px;height:300px"><canvas id="criterios-bar-chart"></canvas></div>
          </div>
        </div>
        <div class="card">
          <div class="card-inner">
            <div class="card-title">Participação por Critério</div>
            <div class="card-sub">Peso relativo de cada critério no custo total</div>
            <div id="wrap-donut-criterio" style="display:flex;flex-direction:column;align-items:center;margin-top:14px">
              <div style="height:180px;width:180px;position:relative"><canvas id="custo-criterio-chart"></canvas></div>
              <div id="custo-criterio-legend" class="viz-legend"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Parceiros -->
      <div class="section-label">Parceiros</div>
      <div class="grid-2-even">
        <div class="card">
          <div class="card-inner">
            <div class="card-title">Custo por Parceiro</div>
            <div class="card-sub">Ranking de custo projetado no período</div>
            <div class="chart-wrap" id="wrap-bar-parceiro" style="margin-top:18px;height:300px"><canvas id="custo-parceiro-chart"></canvas></div>
          </div>
        </div>
        <div class="card">
          <div class="card-inner">
            <div class="card-title">Critérios por Parceiro</div>
            <div class="card-sub">Composição do custo de cada parceiro (barras empilhadas)</div>
            <div class="chart-wrap" id="wrap-stacked" style="margin-top:18px;height:300px"><canvas id="evolucao-criterio-chart"></canvas></div>
          </div>
        </div>
      </div>

      <!-- Produtos -->
      <div class="section-label">Movimentação de Produtos</div>
      <div class="card">
        <div class="card-inner" style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:14px">
          <div>
            <div class="card-title">Giro de Produtos</div>
            <div class="card-sub">Entradas, saídas e saldo por produto no período</div>
          </div>
          <div class="table-tools">
            <input id="produtos-search" type="text" class="table-search" placeholder="Filtrar produto...">
          </div>
        </div>
        <div id="produtos-table-container" class="table-scroll" style="border-top:1px solid var(--line-soft)"></div>
      </div>
    `;

            // ── Formatadores ──
            const nf2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const nf0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
            const formatKg = (v) => {
                const num = parseFloat(v) || 0;
                return (Math.abs(num) >= 1000 ? nf0.format(num) : nf2.format(num)) + ' Kg';
            };
            const formatCurrency = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(parseFloat(v) || 0);
            const formatCompact = (v) => {
                const num = parseFloat(v) || 0, abs = Math.abs(num);
                if (abs >= 1e6) return nf2.format(num / 1e6).replace(',00', '') + ' mi';
                if (abs >= 1e3) return nf2.format(num / 1e3).replace(',00', '') + ' mil';
                return nf0.format(num);
            };
            const formatBRLCompact = (v) => 'R$ ' + formatCompact(v);
            const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const monthLabel = (isoDate) => {
                const d = new Date(String(isoDate).slice(0, 10) + 'T00:00:00');
                if (isNaN(d)) return String(isoDate);
                const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
                return `${meses[d.getMonth()]}/${String(d.getFullYear()).slice(-2)}`;
            };
            const dateLabel = (isoDate) => {
                if (!isoDate) return null;
                const d = new Date(String(isoDate).slice(0, 10) + 'T00:00:00');
                return isNaN(d) ? null : d.toLocaleDateString('pt-BR');
            };
            const mapHeaders = (headers) => headers.reduce((acc, h, i) => { acc[h.name.toUpperCase()] = i; return acc; }, {});
            const parseData = (res) => {
                if (!res?.headers || !res?.data) return [];
                const colMap = mapHeaders(res.headers);
                return res.data.map(row => {
                    const obj = {};
                    for (const k in colMap) obj[k] = row[colMap[k]];
                    return obj;
                });
            };
            const firstValue = (res) => (res?.data?.length ? parseFloat(res.data[0][0]) || 0 : 0);

            // ── Chart defaults ──
            Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif";
            Chart.defaults.font.size = 11;
            Chart.defaults.color = INK3;

            const TOOLTIP = {
                backgroundColor: '#ffffff',
                titleColor: INK,
                bodyColor: '#42506a',
                borderColor: '#dbe2ee',
                borderWidth: 1,
                padding: 10,
                cornerRadius: 8,
                boxPadding: 5,
                usePointStyle: true,
                titleFont: { weight: '700', size: 12 },
                bodyFont: { size: 12 }
            };
            const tickFont = { size: 11, weight: '500' };

            const destroyChart = (key) => { if (charts[key]) { charts[key].destroy(); charts[key] = null; } };

            // Plugin: total no centro do donut
            const centerTextPlugin = {
                id: 'centerText',
                afterDraw(chart, args, opts) {
                    if (!opts?.lines?.length) return;
                    const { ctx } = chart;
                    const meta = chart.getDatasetMeta(0);
                    if (!meta?.data?.length) return;
                    const { x, y } = meta.data[0];
                    ctx.save();
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.font = `700 15px 'DM Sans', sans-serif`;
                    ctx.fillStyle = INK;
                    ctx.fillText(opts.lines[0], x, y - 8);
                    ctx.font = `500 10.5px 'DM Sans', sans-serif`;
                    ctx.fillStyle = INK3;
                    ctx.fillText(opts.lines[1] || '', x, y + 10);
                    ctx.restore();
                }
            };
            Chart.register(centerTextPlugin);

            // ── KPIs ──
            const KPI_COLORS = {
                brand: { accent: '#16a37a', chip: '#e6f6f0' },
                blue: { accent: '#2a78d6', chip: '#e9f1fc' },
                red: { accent: '#d84443', chip: '#fdeeee' },
                amber: { accent: '#c98500', chip: '#fdf4e0' },
                steel: { accent: '#52627f', chip: '#eef1f6' },
                orange: { accent: '#d95926', chip: '#fdefe8' }
            };
            const icons = {
                money: `<svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>`,
                up: `<svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 17l6-6 4 4 8-8M14 7h7v7"/></svg>`,
                down: `<svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7l6 6 4-4 8 8M14 17h7v-7"/></svg>`,
                box: `<svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>`,
                history: `<svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3v5h5M3.05 13A9 9 0 106 5.3L3 8"/><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 7v5l4 2"/></svg>`,
                peak: `<svg width="16" height="16" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 3l4 8 5-5 5 15H2L8 3z"/></svg>`
            };

            const kpiTile = ({ title, value, unit, sub, color, icon, hero }) => {
                const c = KPI_COLORS[color] || KPI_COLORS.brand;
                return `
            <div class="kpi ${hero ? 'kpi-hero' : ''}" style="--kpi-accent:${c.accent};--kpi-chip-bg:${c.chip}">
                <div class="kpi-head">
                    <div class="kpi-chip">${icon}</div>
                    <span class="kpi-title">${title}</span>
                </div>
                <div>
                    <div class="kpi-value">${value}${unit ? `<span class="kpi-unit">${unit}</span>` : ''}</div>
                    <div class="kpi-sub">${sub}</div>
                </div>
            </div>`;
            };

            const renderKpis = (kpiData, custoTotal) => {
                const kpiContainer = document.getElementById('kpi-container');
                const peso = (v) => (Math.abs(v) >= 1000 ? nf0 : nf2).format(v);

                const pico = kpiData.picoPeriodo?.data?.[0] || [];
                const picoData = dateLabel(pico[1]);

                kpiContainer.innerHTML = [
                    kpiTile({
                        title: 'Custo Projetado', hero: true, color: 'brand', icon: icons.money,
                        value: formatCurrency(custoTotal), unit: '',
                        sub: 'Soma dos critérios de cobrança no período'
                    }),
                    kpiTile({
                        title: 'Entradas', color: 'blue', icon: icons.up,
                        value: peso(firstValue(kpiData.entradas)), unit: 'Kg',
                        sub: 'Peso recebido no período'
                    }),
                    kpiTile({
                        title: 'Saídas', color: 'red', icon: icons.down,
                        value: peso(firstValue(kpiData.saidas)), unit: 'Kg',
                        sub: 'Peso expedido no período'
                    }),
                    kpiTile({
                        title: 'Saldo em Estoque', color: 'steel', icon: icons.box,
                        value: peso(firstValue(kpiData.saldo)), unit: 'Kg',
                        sub: 'Posição ao final do período'
                    }),
                    kpiTile({
                        title: 'Estoque Atual', color: 'steel', icon: icons.history,
                        value: peso(firstValue(kpiData.estoqueAtual)), unit: 'Kg',
                        sub: 'Entradas − saídas do período'
                    }),
                    kpiTile({
                        title: 'Pico do Período', color: 'amber', icon: icons.peak,
                        value: peso(parseFloat(pico[0]) || 0), unit: 'Kg',
                        sub: picoData ? `Atingido em ${picoData}` : 'Maior saldo no período'
                    })
                ].join('');
            };

            // ── Gráfico: evolução do custo (linha/área) ──
            const renderEvolutionChart = (data) => {
                destroyChart('line');
                const wrap = document.getElementById('wrap-line');
                if (!data.length) { wrap.innerHTML = emptyState(); return; }
                wrap.innerHTML = '<canvas id="line-chart"></canvas>';

                const sorted = [...data].sort((a, b) => String(a.DATA_LANCAMENTO).localeCompare(String(b.DATA_LANCAMENTO)));
                const labels = sorted.map(d => monthLabel(d.DATA_LANCAMENTO));
                const values = sorted.map(d => parseFloat(d.CUSTO || 0));

                const ctx = document.getElementById('line-chart').getContext('2d');
                const gradient = ctx.createLinearGradient(0, 0, 0, 250);
                gradient.addColorStop(0, 'rgba(22, 163, 122, 0.18)');
                gradient.addColorStop(1, 'rgba(22, 163, 122, 0)');

                charts.line = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Custo projetado',
                            data: values,
                            borderColor: '#16a37a',
                            backgroundColor: gradient,
                            tension: 0.35, fill: true, borderWidth: 2,
                            pointRadius: 4, pointHoverRadius: 6,
                            pointBackgroundColor: '#16a37a', pointBorderColor: '#fff', pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { display: false },
                            tooltip: { ...TOOLTIP, callbacks: { label: ctx => ' ' + formatCurrency(ctx.parsed.y) } }
                        },
                        scales: {
                            x: { grid: { display: false }, border: { color: '#dfe5ef' }, ticks: { font: tickFont } },
                            y: {
                                grid: { color: GRID }, border: { display: false }, beginAtZero: true,
                                ticks: { font: tickFont, maxTicksLimit: 6, callback: v => formatBRLCompact(v) }
                            }
                        }
                    }
                });
            };

            // ── Donut genérico com legenda (nome, valor, %) ──
            const renderDonut = (key, canvasId, legendId, wrapId, items, centerLabel) => {
                destroyChart(key);
                const wrap = document.getElementById(wrapId);
                if (!items.length) { wrap.innerHTML = emptyState(); return; }

                const total = items.reduce((s, d) => s + d.value, 0);
                charts[key] = new Chart(document.getElementById(canvasId).getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: items.map(d => d.label),
                        datasets: [{
                            data: items.map(d => d.value),
                            backgroundColor: items.map((_, i) => PALETTE[i % PALETTE.length]),
                            borderWidth: 2, borderColor: '#ffffff', spacing: 2, borderRadius: 3
                        }]
                    },
                    options: {
                        cutout: '70%',
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                ...TOOLTIP,
                                callbacks: {
                                    label: ctx => {
                                        const pct = total ? (ctx.parsed / total * 100) : 0;
                                        return ` ${formatCurrency(ctx.parsed)} (${nf2.format(pct).replace(',00', '')}%)`;
                                    }
                                }
                            },
                            centerText: { lines: [formatBRLCompact(total), centerLabel] }
                        }
                    }
                });

                document.getElementById(legendId).innerHTML = items.map((d, i) => `
            <div class="viz-legend-item">
                <span class="viz-legend-dot" style="background:${PALETTE[i % PALETTE.length]}"></span>
                <span class="viz-legend-name" title="${escapeHtml(d.label)}">${escapeHtml(d.label)}</span>
                <span class="viz-legend-val">${formatBRLCompact(d.value)}</span>
                <span class="viz-legend-pct">${total ? nf0.format(d.value / total * 100) : 0}%</span>
            </div>`).join('');
            };

            // ── Cards de critérios ──
            const renderCriteriaCards = (criteriosData) => {
                const grid = document.getElementById('criterios-grid');
                if (!criteriosData.length) { grid.innerHTML = `<div class="card"><div class="card-inner">${emptyState()}</div></div>`; return; }
                const sorted = [...criteriosData].sort((a, b) => parseFloat(b.CUSTO_TOTAL) - parseFloat(a.CUSTO_TOTAL));
                const total = sorted.reduce((s, d) => s + (parseFloat(d.CUSTO_TOTAL) || 0), 0);
                grid.innerHTML = sorted.map(item => {
                    const v = parseFloat(item.CUSTO_TOTAL || 0);
                    const pct = total ? (v / total * 100) : 0;
                    return `
            <div class="criterio-card">
                <div class="criterio-name" title="${escapeHtml(item.SERVICO)}">${escapeHtml(item.SERVICO)}</div>
                <div>
                    <div class="criterio-value">${formatCurrency(v)}</div>
                </div>
                <span class="criterio-share">${nf0.format(pct)}% do total</span>
            </div>`;
                }).join('');
            };

            // ── Barras horizontais (critérios / parceiros) ──
            const renderHBar = (key, canvasId, wrapId, items, color) => {
                destroyChart(key);
                const wrap = document.getElementById(wrapId);
                if (!items.length) { wrap.innerHTML = emptyState(); return; }
                wrap.innerHTML = `<canvas id="${canvasId}"></canvas>`;

                charts[key] = new Chart(document.getElementById(canvasId).getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: items.map(d => d.label),
                        datasets: [{
                            data: items.map(d => d.value),
                            backgroundColor: color,
                            borderRadius: { topRight: 4, bottomRight: 4 },
                            borderSkipped: 'start',
                            barPercentage: 0.72, categoryPercentage: 0.82
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { ...TOOLTIP, callbacks: { label: ctx => ' ' + formatCurrency(ctx.parsed.x) } }
                        },
                        scales: {
                            x: {
                                grid: { color: GRID }, border: { display: false }, beginAtZero: true,
                                ticks: { font: tickFont, maxTicksLimit: 6, callback: v => formatBRLCompact(v) }
                            },
                            y: {
                                grid: { display: false }, border: { color: '#dfe5ef' },
                                ticks: { font: tickFont, color: '#4a5872', autoSkip: false, callback: function (v) { const l = this.getLabelForValue(v); return l.length > 22 ? l.slice(0, 21) + '…' : l; } }
                            }
                        }
                    }
                });
            };

            // ── Barras empilhadas: critérios por parceiro ──
            const renderStackedChart = (data) => {
                destroyChart('stacked');
                const wrap = document.getElementById('wrap-stacked');
                if (!data.length) { wrap.innerHTML = emptyState(); return; }
                wrap.innerHTML = '<canvas id="evolucao-criterio-chart"></canvas>';

                const parceiros = [...new Set(data.map(d => d.NOMEPARC))];
                const criterios = [...new Set(data.map(d => d.NOME_CRITERIO))];

                charts.stacked = new Chart(document.getElementById('evolucao-criterio-chart').getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: parceiros,
                        datasets: criterios.map((c, i) => ({
                            label: c,
                            data: parceiros.map(p => {
                                const e = data.find(d => d.NOMEPARC === p && d.NOME_CRITERIO === c);
                                return e ? parseFloat(e.CUSTO_TOTAL || 0) : 0;
                            }),
                            backgroundColor: PALETTE[i % PALETTE.length],
                            borderColor: '#ffffff', borderWidth: 1,
                            barPercentage: 0.72, categoryPercentage: 0.82
                        }))
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'top', align: 'start',
                                labels: { boxWidth: 9, boxHeight: 9, usePointStyle: true, pointStyle: 'rectRounded', padding: 12, font: { size: 11, weight: '500' }, color: '#4a5872' }
                            },
                            tooltip: {
                                ...TOOLTIP,
                                callbacks: { label: ctx => ` ${ctx.dataset.label}: ${formatCurrency(ctx.parsed.x)}` }
                            }
                        },
                        scales: {
                            x: {
                                stacked: true, grid: { color: GRID }, border: { display: false }, beginAtZero: true,
                                ticks: { font: tickFont, maxTicksLimit: 6, callback: v => formatBRLCompact(v) }
                            },
                            y: {
                                stacked: true, grid: { display: false }, border: { color: '#dfe5ef' },
                                ticks: { font: tickFont, color: '#4a5872', autoSkip: false, callback: function (v) { const l = this.getLabelForValue(v); return l.length > 20 ? l.slice(0, 19) + '…' : l; } }
                            }
                        }
                    }
                });
            };

            // ── Tabela de produtos ──
            let produtosCache = [];
            const renderProductsTable = (data, filter = '') => {
                const container = document.getElementById('produtos-table-container');
                const rows = filter
                    ? data.filter(r => String(r.PRODUTO || '').toLowerCase().includes(filter.toLowerCase()))
                    : data;
                if (!rows.length) { container.innerHTML = emptyState(filter ? 'Nenhum produto corresponde ao filtro' : undefined); return; }

                const tot = rows.reduce((a, r) => ({
                    ent: a.ent + (parseFloat(r.ENTRADA) || 0),
                    sai: a.sai + (parseFloat(r.SAIDA) || 0),
                    sal: a.sal + (parseFloat(r.SALDO) || 0),
                    val: a.val + (parseFloat(r.VALOR_TOTAL) || 0)
                }), { ent: 0, sai: 0, sal: 0, val: 0 });

                container.innerHTML = `
            <table class="data-table">
              <thead>
                <tr>
                  <th>Produto</th><th>Entrada</th><th>Saída</th><th>Saldo</th><th>Valor em Estoque</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(row => {
                    const saldo = parseFloat(row.SALDO) || 0;
                    return `
                <tr>
                  <td><span class="product-name">${escapeHtml(row.PRODUTO)}</span></td>
                  <td><span class="num-pos">${formatKg(row.ENTRADA)}</span></td>
                  <td><span class="num-neg">${formatKg(row.SAIDA)}</span></td>
                  <td><span class="${saldo < 0 ? 'num-neg' : 'num-strong'}">${formatKg(saldo)}</span></td>
                  <td><span class="num-strong">${formatCurrency(row.VALOR_TOTAL)}</span></td>
                </tr>`;
                }).join('')}
              </tbody>
              <tfoot>
                <tr>
                  <td>Total (${nf0.format(rows.length)} produto${rows.length === 1 ? '' : 's'})</td>
                  <td>${formatKg(tot.ent)}</td>
                  <td>${formatKg(tot.sai)}</td>
                  <td class="${tot.sal < 0 ? 'num-neg' : ''}">${formatKg(tot.sal)}</td>
                  <td>${formatCurrency(tot.val)}</td>
                </tr>
              </tfoot>
            </table>`;
            };

            // ── Filtros ──
            const populateFilters = (parceirosData, tiposData) => {
                const ps = document.getElementById('filtro-parceiro');
                const ts = document.getElementById('filtro-tipo');
                ps.innerHTML = '<option value="all">Todos os parceiros</option>';
                ts.innerHTML = '<option value="all">Todos os tipos</option>';
                parceirosData.forEach(r => { ps.innerHTML += `<option value="${escapeHtml(r[0])}">${escapeHtml(r[1])}</option>`; });
                tiposData.forEach(r => { ts.innerHTML += `<option value="${escapeHtml(r[0])}">${escapeHtml(r[1])}</option>`; });
            };

            async function handleFilterChange() {
                if (typeof setVariableMitra !== 'function') return;
                contentContainer.innerHTML = initialHtmlContent;
                const dataInicial = document.getElementById('data-inicial').value;
                const dataFinal = document.getElementById('data-final').value;
                const parceiroId = document.getElementById('filtro-parceiro').value;
                const tipoId = document.getElementById('filtro-tipo').value;
                try {
                    await Promise.all([
                        setVariableMitra({ name: ':VAR_DT_INICIO', content: dataInicial }),
                        setVariableMitra({ name: ':VAR_DT_FIM', content: dataFinal }),
                        setVariableMitra({ name: ':VAR_FILTRO_PARCEIRO', content: parceiroId }),
                        setVariableMitra({ name: ':VAR_FILTRO_TIPO', content: tipoId })
                    ]);
                    await reloadData();
                } catch (e) {
                    console.error(e);
                    contentContainer.innerHTML = errorHtmlContent;
                }
            }

            const setupEventListeners = () => {
                ['data-inicial', 'data-final', 'filtro-parceiro', 'filtro-tipo'].forEach(id => {
                    document.getElementById(id).addEventListener('change', handleFilterChange);
                });
            };

            const updateTopbarMeta = () => {
                const di = document.getElementById('data-inicial').value;
                const df = document.getElementById('data-final').value;
                const fmt = (v) => v ? new Date(v + 'T00:00:00').toLocaleDateString('pt-BR') : '—';
                const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('topbar-meta').textContent = `Período: ${fmt(di)} – ${fmt(df)} · Atualizado às ${hora}`;
            };

            async function reloadData() {
                try {
                    const jdbcId = parseInt(componentData.jdbcId, 10);

                    const [
                        kpiEntradasRes, kpiSaidasRes, kpiSaldoRes, kpiSaldoHistoricoRes, kpiEstoqueAtualRes, kpiPicoPeriodoRes,
                        evolucaoRes, composicaoRes, criteriosRes, produtosRes,
                        custoParceiroRes, custoCriterioRes, evolucaoCriterioRes
                    ] = await Promise.all([
                        queryMitra({ query: componentData.queryKpiEntradas, jdbcId }),
                        queryMitra({ query: componentData.queryKpiSaidas, jdbcId }),
                        queryMitra({ query: componentData.queryKpiSaldo, jdbcId }),
                        queryMitra({ query: componentData.queryKpiSaldoHistorico, jdbcId }),
                        queryMitra({ query: componentData.queryKpiEstoqueAtual, jdbcId }),
                        queryMitra({ query: componentData.queryKpiPicoPeriodo, jdbcId }),
                        queryMitra({ query: componentData.queryEvolucao, jdbcId }),
                        queryMitra({ query: componentData.queryComposicao, jdbcId }),
                        queryMitra({ query: componentData.queryCriterios, jdbcId }),
                        queryMitra({ query: componentData.queryProdutos, jdbcId }),
                        queryMitra({ query: componentData.queryCustoParceiro, jdbcId }),
                        queryMitra({ query: componentData.queryCustoCriterio, jdbcId }),
                        queryMitra({ query: componentData.queryEvolucaoCriterioParceiro, jdbcId })
                    ]);

                    const kpiData = {
                        entradas: kpiEntradasRes, saidas: kpiSaidasRes, saldo: kpiSaldoRes,
                        saldoHistorico: kpiSaldoHistoricoRes, estoqueAtual: kpiEstoqueAtualRes, picoPeriodo: kpiPicoPeriodoRes
                    };

                    contentContainer.innerHTML = dashboardHtmlStructure;

                    const criterios = parseData(criteriosRes);
                    const custoTotal = criterios.reduce((s, d) => s + (parseFloat(d.CUSTO_TOTAL) || 0), 0);

                    renderKpis(kpiData, custoTotal);
                    renderEvolutionChart(parseData(evolucaoRes));

                    renderDonut('donut', 'donut-chart', 'donut-legend', 'wrap-donut',
                        parseData(composicaoRes).map(d => ({ label: d.TIPO, value: parseFloat(d.CUSTO) || 0 })),
                        'por tipo');

                    renderCriteriaCards(criterios);
                    renderHBar('barCriterios', 'criterios-bar-chart', 'wrap-bar-criterios',
                        [...criterios].sort((a, b) => parseFloat(b.CUSTO_TOTAL) - parseFloat(a.CUSTO_TOTAL))
                            .map(d => ({ label: d.SERVICO, value: parseFloat(d.CUSTO_TOTAL) || 0 })),
                        '#16a37a');

                    renderDonut('donutCriterio', 'custo-criterio-chart', 'custo-criterio-legend', 'wrap-donut-criterio',
                        parseData(custoCriterioRes).map(d => ({ label: d.NOME_CRITERIO, value: parseFloat(d.CUSTO_TOTAL) || 0 })),
                        'custo total');

                    renderHBar('barParceiro', 'custo-parceiro-chart', 'wrap-bar-parceiro',
                        [...parseData(custoParceiroRes)].sort((a, b) => parseFloat(b.CUSTO_TOTAL) - parseFloat(a.CUSTO_TOTAL))
                            .map(d => ({ label: d.NOMEPARC, value: parseFloat(d.CUSTO_TOTAL) || 0 })),
                        '#2a78d6');

                    renderStackedChart(parseData(evolucaoCriterioRes));

                    produtosCache = parseData(produtosRes);
                    renderProductsTable(produtosCache);
                    const search = document.getElementById('produtos-search');
                    if (search) search.addEventListener('input', () => renderProductsTable(produtosCache, search.value));

                    updateTopbarMeta();

                } catch (e) {
                    console.error(e);
                    contentContainer.innerHTML = errorHtmlContent;
                }
            }

            async function initializeComponent() {
                contentContainer.innerHTML = initialHtmlContent;
                try {
                    const jdbcId = parseInt(componentData.jdbcId, 10);
                    const [parceirosRes, tiposRes] = await Promise.all([
                        queryMitra({ query: componentData.queryFiltroParceiros, jdbcId }),
                        queryMitra({ query: componentData.queryFiltroTipos, jdbcId })
                    ]);
                    populateFilters(parceirosRes.data, tiposRes.data);
                    setupEventListeners();

                    const today = new Date();
                    const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
                    const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    document.getElementById('data-final').value = fmt(today);
                    document.getElementById('data-inicial').value = fmt(firstDay);

                    await handleFilterChange();
                } catch (e) {
                    console.error(e);
                    contentContainer.innerHTML = errorHtmlContent;
                }
            }

            document.body.addEventListener(MITRA_UPDATE_EVENT_NAME, reloadData);

            const waitForMitraAndInit = () => {
                const start = Date.now();
                const iv = setInterval(() => {
                    if (window.componentData && componentData.queryEvolucao && componentData.jdbcId) {
                        clearInterval(iv);
                        initializeComponent();
                    } else if (Date.now() - start > 5000) {
                        clearInterval(iv);
                        document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'DM Sans',sans-serif;color:#b03432;background:#fdf1f1">Erro Crítico: configurações do componente não carregadas.</div>`;
                    }
                }, 100);
            };

            waitForMitraAndInit();
        });
    </script>
</body>

</html>
