
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balanço Patrimonial</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96.1%;
            --secondary-foreground: 222.2 84% 4.9%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --accent: 210 40% 96.1%;
            --accent-foreground: 222.2 84% 4.9%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;
            --radius: 0.5rem;
        }
        .dark {
            --background: 222.2 84% 4.9%;
            --foreground: 210 40% 98%;
            --primary: 210 40% 98%;
            --primary-foreground: 222.2 47.4% 11.2%;
            --secondary: 217.2 32.6% 17.5%;
            --secondary-foreground: 210 40% 98%;
            --muted: 217.2 32.6% 17.5%;
            --muted-foreground: 215 20.2% 65.1%;
            --accent: 217.2 32.6% 17.5%;
            --accent-foreground: 210 40% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 210 40% 98%;
            --border: 217.2 32.6% 17.5%;
            --input: 217.2 32.6% 17.5%;
            --ring: 212.7 26.8% 83.9%;
        }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-8">
    <div id="report-container" class="w-full h-full overflow-y-auto">
        <div id="loading-state" class="flex items-center justify-center h-full">
            <p class="text-lg text-muted-foreground">Carregando dados do balanço...</p>
        </div>
        <div id="report-content" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-12 gap-y-8">
                <!-- Coluna da Esquerda: Ativo -->
                <div id="ativo-container" class="space-y-8"></div>
                <!-- Coluna da Direita: Passivo e PL -->
                <div id="passivo-pl-container" class="space-y-8"></div>
            </div>
            <!-- Seção de Totais -->
            <div id="totais-container" class="mt-12 grid grid-cols-1 lg:grid-cols-2 gap-x-12 gap-y-8">
            </div>
            <div id="aviso-container" class="mt-8"></div>
        </div>
    </div>
    <script>
        const MITRA_UPDATE_EVENT_NAME = 'mitra-update-balanco-patrimonial';
        function updateMitra() {
            console.log("Sinal de update para [Balanço Patrimonial] recebido. Disparando evento.");
            document.body.dispatchEvent(new CustomEvent(MITRA_UPDATE_EVENT_NAME));
        }
        /* ------------------------------------------------------------------
           Resolução tolerante dos parâmetros do componente.

           A trava antiga lia componentData.varMes pelo nome exato. Nome de
           propriedade em JavaScript diferencia maiúscula de minúscula, então
           um parâmetro registrado como "Varmes" ou "VarDataInicio" fazia a
           condição nunca fechar: venciam os 5 segundos e a tela morria em
           branco, sem dizer o que faltou.
           ------------------------------------------------------------------ */
        function normalizeKey(k) {
            return String(k).toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function pickParam(obj, ...nomes) {
            if (!obj) return undefined;
            const mapa = {};
            Object.keys(obj).forEach(k => { mapa[normalizeKey(k)] = obj[k]; });
            for (const n of nomes) {
                const v = mapa[normalizeKey(n)];
                if (v !== undefined && v !== null && String(v).trim() !== '') return v;
            }
            return undefined;
        }

        /* SO a query e obrigatoria.

           As datas e a empresa NAO precisam de parametro no componente: a
           plataforma resolve :VAR_DATA_INICIO, :VAR_DATA_FIM e
           :VAR_EMPRESA_DRE direto no texto da query, a partir dos filtros da
           tela. O "varMes" so existia porque o JavaScript montava uma segunda
           consulta com ele - e essa consulta foi removida. */
        const PARAMS = {
            queryDados: ['queryDados', 'query_dados', 'querydado', 'query']
        };

        function resolveParams() {
            const cd = window.componentData || {};
            const out = {}, faltando = [];
            for (const [alvo, nomes] of Object.entries(PARAMS)) {
                const v = pickParam(cd, ...nomes);
                if (v === undefined) faltando.push(alvo); else out[alvo] = v;
            }
            return { valores: out, faltando, chaves: Object.keys(cd) };
        }

        /* NULL vindo da query significa "o ano desta coluna nao tem conta
           vinculada". Isso NAO e zero. Antes a tela fazia
           parseFloat(v) || 0 e mostrava 0,00, ou seja falta de cadastro
           passava por saldo zero. */
        function isSemCadastro(v) {
            return v === null || v === undefined || v === '';
        }

        function toNumeroOuNulo(v) {
            if (isSemCadastro(v)) return null;
            const n = parseFloat(v);
            return isNaN(n) ? null : n;
        }

        function renderValor(value) {
            if (isSemCadastro(value)) {
                return '<span class="text-muted-foreground italic" title="O ano desta coluna nao tem conta contabil vinculada nesta linha">sem cadastro</span>';
            }
            return formatCurrency(value);
        }

        /* subtotal a que faltam linhas ganha asterisco, para nao ser lido
           como numero fechado */
        function renderSubtotal(valor, falta) {
            const base = isSemCadastro(valor) ? renderValor(valor) : formatCurrency(valor);
            if (!falta) return base;
            return `${base} <span class="text-muted-foreground" title="${falta} linha(s) deste grupo sem cadastro no ano - subtotal incompleto">*</span>`;
        }

        /* A plataforma devolve a data como 'DD/MM/AAAA HH:MM:SS' (e as vezes
           como AAAA-MM-DD). Para o cabecalho so interessa o ANO, e o primeiro
           grupo de 4 digitos resolve todos os casos - dia e mes tem 2 digitos,
           entao nunca casam primeiro.

           Isto tambem blinda contra ANO_ATU voltar como data em vez de
           inteiro: Number('01/01/2026 00:00:00') daria NaN no cabecalho. */
        function anoDe(valor) {
            const m = String(valor || '').match(/(\d{4})/);
            return m ? Number(m[1]) : null;
        }

        function formatDateBR(valor) {
            if (!valor) return '';
            const iso = String(valor).split(' ')[0].split('T')[0];
            const p = iso.split('-');
            return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : String(valor);
        }

        function formatCurrency(value) {
            const num = parseFloat(value);
            if (isNaN(num)) {
                return '0,00';
            }
            const formatted = new Intl.NumberFormat('pt-BR', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(Math.abs(num));
            return num < 0 ? `(${formatted})` : formatted;
        }
        function generateTableHtml(title, items, subtotal, currentYear, previousYear) {
            let itemsHtml = items.map(item => `
                <tr class="border-b border-border">
                    <td class="py-2 px-4 text-sm text-muted-foreground">${item.nomeGrupo}</td>
                    <td class="py-2 px-4 text-sm text-right tabular-nums">${renderValor(item.valorAtual)}</td>
                    <td class="py-2 px-4 text-sm text-right tabular-nums">${renderValor(item.valorAnterior)}</td>
                </tr>
            `).join('');
            let subtotalHtml = `
                <tr class="font-bold bg-secondary">
                    <td class="py-2 px-4 text-sm">${subtotal.descricao}</td>
                    <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotal.valorAtual, subtotal.faltaAtual)}</td>
                    <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotal.valorAnterior, subtotal.faltaAnterior)}</td>
                </tr>
            `;
            return `
                <div class="w-full">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="border-b-2 border-foreground">
                                <th class="py-2 px-4 text-left text-base font-bold">${title}</th>
                                <th class="py-2 px-4 text-right text-sm font-semibold w-32">${currentYear}</th>
                                <th class="py-2 px-4 text-right text-sm font-semibold w-32">${previousYear}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHtml}
                            ${subtotalHtml}
                        </tbody>
                    </table>
                </div>
            `;
        }
        function generateTotalTableHtml(title, total, currentYear, previousYear) {
             return `
                <div class="w-full">
                    <table class="w-full border-collapse">
                        <tbody>
                             <tr class="font-bold border-y-2 border-double border-foreground bg-secondary">
                                <td class="py-3 px-4 text-base">${title}</td>
                                <td class="py-3 px-4 text-base text-right tabular-nums w-32">${renderSubtotal(total.valorAtual, total.faltaAtual)}</td>
                                <td class="py-3 px-4 text-base text-right tabular-nums w-32">${renderSubtotal(total.valorAnterior, total.faltaAnterior)}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }
        function normalizeOrder(value) {
            return String(value || '').replace(/\s+/g, '');
        }
        function startsWithOrder(ordem, prefixo) {
            const normalizado = normalizeOrder(ordem);
            const prefixoNormalizado = normalizeOrder(prefixo);
            return normalizado.startsWith(prefixoNormalizado);
        }
        function createSubtotal(descricao) {
            return { descricao, valorAtual: 0, valorAnterior: 0, faltaAtual: 0, faltaAnterior: 0 };
        }
        /* Soma apenas as linhas que tem cadastro, e CONTA as que nao tem.
           Tratar "sem cadastro" como zero daria um subtotal que parece
           completo e nao e. */
        function sumItems(items, descricao) {
            return items.reduce((acc, item) => {
                if (isSemCadastro(item.valorAtual)) acc.faltaAtual++;
                else acc.valorAtual += item.valorAtual;
                if (isSemCadastro(item.valorAnterior)) acc.faltaAnterior++;
                else acc.valorAnterior += item.valorAnterior;
                return acc;
            }, createSubtotal(descricao));
        }
        function somaTotais(descricao, ...partes) {
            return partes.reduce((acc, p) => {
                acc.valorAtual += p.valorAtual;
                acc.valorAnterior += p.valorAnterior;
                acc.faltaAtual += p.faltaAtual;
                acc.faltaAnterior += p.faltaAnterior;
                return acc;
            }, createSubtotal(descricao));
        }
        function renderReport(data, currentYear, previousYear, periodo) {
            periodo = periodo || {};

            /* cabecalho das colunas: so o ano, extraido com anoDe para nao
               escapar '29/09/2026 00:00:00' nem NaN */
            currentYear = anoDe(currentYear) || anoDe(periodo.dataFim) || new Date().getFullYear();
            previousYear = anoDe(previousYear) || (currentYear - 1);

            // ATIVO
            const ativoCirculanteItems = data.filter(d => startsWithOrder(d.ordem, '1.1.'));
            ativoCirculanteItems.sort((a, b) => normalizeOrder(a.ordem).localeCompare(normalizeOrder(b.ordem)));
            const subtotalAtivoCirculante = sumItems(ativoCirculanteItems, '1.1. = Total do ativo circulante');

            const ativoNaoCirculanteItems = data.filter(d => startsWithOrder(d.ordem, '1.2.'));
            ativoNaoCirculanteItems.sort((a, b) => normalizeOrder(a.ordem).localeCompare(normalizeOrder(b.ordem)));
            const subtotalAtivoNaoCirculante = sumItems(ativoNaoCirculanteItems, '1.2. = Total do ativo não circulante');
            const totalAtivo = somaTotais('1. = Total do ativo',
                subtotalAtivoCirculante, subtotalAtivoNaoCirculante);
            
            // Subtotais customizados (somente exibição) para não impactar totais gerais
            const duplicatasAReceberItems = ativoCirculanteItems.filter(item =>
                startsWithOrder(item.ordem, '1.1.2.1.1') ||
                startsWithOrder(item.ordem, '1.1.2.1.2') ||
                startsWithOrder(item.ordem, '1.1.2.1.3') ||
                startsWithOrder(item.ordem, '1.1.2.1.4')
            );
            const subtotalDuplicatasAReceber = sumItems(duplicatasAReceberItems, 'Duplicatas a receber');

            const creditosItems = ativoCirculanteItems.filter(item =>
                startsWithOrder(item.ordem, '1.1.2.1.1') ||
                startsWithOrder(item.ordem, '1.1.2.1.2') ||
                startsWithOrder(item.ordem, '1.1.2.1.3') ||
                startsWithOrder(item.ordem, '1.1.2.1.4') ||
                startsWithOrder(item.ordem, '1.1.2.2') ||
                startsWithOrder(item.ordem, '1.1.2.3')
            );
            const subtotalCreditos = sumItems(creditosItems, 'Créditos');

            let acBodyHtml = '';
            let creditosGroupAdded = false;
            let duplicatasGroupAdded = false;

            ativoCirculanteItems.forEach(item => {
                const isDuplicataItem =
                    startsWithOrder(item.ordem, '1.1.2.1.1') ||
                    startsWithOrder(item.ordem, '1.1.2.1.2') ||
                    startsWithOrder(item.ordem, '1.1.2.1.3') ||
                    startsWithOrder(item.ordem, '1.1.2.1.4');

                const isCreditoItem = isDuplicataItem || startsWithOrder(item.ordem, '1.1.2.2') || startsWithOrder(item.ordem, '1.1.2.3');

                // Colocar primeiro: totalizador "Créditos" (uma única vez, antes do 1º item do grupo)
                if (isCreditoItem && !creditosGroupAdded) {
                    acBodyHtml += `
                        <tr class="font-bold bg-secondary">
                            <td class="py-2 px-4 text-sm pl-4">${subtotalCreditos.descricao}</td>
                            <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalCreditos.valorAtual, subtotalCreditos.faltaAtual)}</td>
                            <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalCreditos.valorAnterior, subtotalCreditos.faltaAnterior)}</td>
                        </tr>
                    `;
                    creditosGroupAdded = true;
                }

                // Colocar primeiro: totalizador "Duplicatas a receber" (uma única vez, antes do 1º item do grupo)
                if (isDuplicataItem && !duplicatasGroupAdded) {
                    acBodyHtml += `
                        <tr class="font-bold bg-secondary">
                            <td class="py-2 px-4 text-sm pl-8">${subtotalDuplicatasAReceber.descricao}</td>
                            <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalDuplicatasAReceber.valorAtual, subtotalDuplicatasAReceber.faltaAtual)}</td>
                            <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalDuplicatasAReceber.valorAnterior, subtotalDuplicatasAReceber.faltaAnterior)}</td>
                        </tr>
                    `;
                    duplicatasGroupAdded = true;
                }

                // Indentação dos itens filhos
                const indentClass = isDuplicataItem ? 'pl-12' : (isCreditoItem ? 'pl-8' : '');
                acBodyHtml += `
                    <tr class="border-b border-border">
                        <td class="py-2 px-4 text-sm text-muted-foreground ${indentClass}">${item.nomeGrupo}</td>
                        <td class="py-2 px-4 text-sm text-right tabular-nums">${renderValor(item.valorAtual)}</td>
                        <td class="py-2 px-4 text-sm text-right tabular-nums">${renderValor(item.valorAnterior)}</td>
                    </tr>
                `;
            });

            const subtotalAcHtml = `
                <tr class="font-bold bg-secondary">
                    <td class="py-2 px-4 text-sm">${subtotalAtivoCirculante.descricao}</td>
                    <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalAtivoCirculante.valorAtual, subtotalAtivoCirculante.faltaAtual)}</td>
                    <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalAtivoCirculante.valorAnterior, subtotalAtivoCirculante.faltaAnterior)}</td>
                </tr>
            `;

            const htmlAtivoCirculante = `
                <div class="w-full">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="border-b-2 border-foreground">
                                <th class="py-2 px-4 text-left text-base font-bold">1.1. = Ativo circulante</th>
                                <th class="py-2 px-4 text-right text-sm font-semibold w-32">${currentYear}</th>
                                <th class="py-2 px-4 text-right text-sm font-semibold w-32">${previousYear}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${acBodyHtml}
                            ${subtotalAcHtml}
                        </tbody>
                    </table>
                </div>
            `;

            // Subtotais customizados (somente exibição) para Ativo não circulante
            const investimentosItems = ativoNaoCirculanteItems.filter(item =>
                startsWithOrder(item.ordem, '1.2.2.1') ||
                startsWithOrder(item.ordem, '1.2.2.2')
            );
            const subtotalInvestimentos = sumItems(investimentosItems, 'Investimentos');

            const imobilizadoItems = ativoNaoCirculanteItems.filter(item =>
                startsWithOrder(item.ordem, '1.2.3.1') ||
                startsWithOrder(item.ordem, '1.2.3.2')
            );
            const subtotalImobilizado = sumItems(imobilizadoItems, 'Imobilizado');

            const intangivelItems = ativoNaoCirculanteItems.filter(item =>
                startsWithOrder(item.ordem, '1.2.4.1') ||
                startsWithOrder(item.ordem, '1.2.4.2')
            );
            const subtotalIntangivel = sumItems(intangivelItems, 'Intangível');

            let ancBodyHtml = '';
            let investimentosGroupAdded = false;
            let imobilizadoGroupAdded = false;
            let intangivelGroupAdded = false;

            ativoNaoCirculanteItems.forEach(item => {
                const isInvestimentoItem =
                    startsWithOrder(item.ordem, '1.2.2.1') ||
                    startsWithOrder(item.ordem, '1.2.2.2');

                const isImobilizadoItem =
                    startsWithOrder(item.ordem, '1.2.3.1') ||
                    startsWithOrder(item.ordem, '1.2.3.2');

                const isIntangivelItem =
                    startsWithOrder(item.ordem, '1.2.4.1') ||
                    startsWithOrder(item.ordem, '1.2.4.2');

                if (isInvestimentoItem && !investimentosGroupAdded) {
                    ancBodyHtml += `
                        <tr class="font-bold bg-secondary">
                            <td class="py-2 px-4 text-sm pl-4">${subtotalInvestimentos.descricao}</td>
                            <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalInvestimentos.valorAtual, subtotalInvestimentos.faltaAtual)}</td>
                            <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalInvestimentos.valorAnterior, subtotalInvestimentos.faltaAnterior)}</td>
                        </tr>
                    `;
                    investimentosGroupAdded = true;
                }

                if (isImobilizadoItem && !imobilizadoGroupAdded) {
                    ancBodyHtml += `
                        <tr class="font-bold bg-secondary">
                            <td class="py-2 px-4 text-sm pl-4">${subtotalImobilizado.descricao}</td>
                            <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalImobilizado.valorAtual, subtotalImobilizado.faltaAtual)}</td>
                            <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalImobilizado.valorAnterior, subtotalImobilizado.faltaAnterior)}</td>
                        </tr>
                    `;
                    imobilizadoGroupAdded = true;
                }

                if (isIntangivelItem && !intangivelGroupAdded) {
                    ancBodyHtml += `
                        <tr class="font-bold bg-secondary">
                            <td class="py-2 px-4 text-sm pl-4">${subtotalIntangivel.descricao}</td>
                            <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalIntangivel.valorAtual, subtotalIntangivel.faltaAtual)}</td>
                            <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalIntangivel.valorAnterior, subtotalIntangivel.faltaAnterior)}</td>
                        </tr>
                    `;
                    intangivelGroupAdded = true;
                }

                const indentClass = (isInvestimentoItem || isImobilizadoItem || isIntangivelItem) ? 'pl-8' : '';
                ancBodyHtml += `
                    <tr class="border-b border-border">
                        <td class="py-2 px-4 text-sm text-muted-foreground ${indentClass}">${item.nomeGrupo}</td>
                        <td class="py-2 px-4 text-sm text-right tabular-nums">${renderValor(item.valorAtual)}</td>
                        <td class="py-2 px-4 text-sm text-right tabular-nums">${renderValor(item.valorAnterior)}</td>
                    </tr>
                `;
            });

            const subtotalAncHtml = `
                <tr class="font-bold bg-secondary">
                    <td class="py-2 px-4 text-sm">${subtotalAtivoNaoCirculante.descricao}</td>
                    <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalAtivoNaoCirculante.valorAtual, subtotalAtivoNaoCirculante.faltaAtual)}</td>
                    <td class="py-2 px-4 text-sm text-right tabular-nums">${renderSubtotal(subtotalAtivoNaoCirculante.valorAnterior, subtotalAtivoNaoCirculante.faltaAnterior)}</td>
                </tr>
            `;

            const htmlAtivoNaoCirculante = `
                <div class="w-full">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="border-b-2 border-foreground">
                                <th class="py-2 px-4 text-left text-base font-bold">1.2. = Ativo não circulante</th>
                                <th class="py-2 px-4 text-right text-sm font-semibold w-32">${currentYear}</th>
                                <th class="py-2 px-4 text-right text-sm font-semibold w-32">${previousYear}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${ancBodyHtml}
                            ${subtotalAncHtml}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('ativo-container').innerHTML = htmlAtivoCirculante + htmlAtivoNaoCirculante;

            // PASSIVO
            const passivoCirculanteItemsAll = data.filter(d => startsWithOrder(d.ordem, '2.1.'));
            passivoCirculanteItemsAll.sort((a, b) => normalizeOrder(a.ordem).localeCompare(normalizeOrder(b.ordem)));

            // Subtotal para Empréstimos (2.1.4.1.1 + 2.1.4.1.2)
            const emprestimosPcItems = passivoCirculanteItemsAll.filter(item =>
                startsWithOrder(item.ordem, '2.1.4.1.1') ||
                startsWithOrder(item.ordem, '2.1.4.1.2')
            );
            const subtotalEmprestimosPc = sumItems(emprestimosPcItems, 'Empréstimos');

            // Subtotal para Financiamentos (2.1.5.1 + 2.1.5.2)
            const financiamentosPcItems = passivoCirculanteItemsAll.filter(item =>
                startsWithOrder(item.ordem, '2.1.5.1') ||
                startsWithOrder(item.ordem, '2.1.5.2')
            );

            const avisos = [];

            const diag = window.__DIAG || {};

        async function fetchAndRenderData() {
            const container = document.getElementById('report-container');
            const contentEl = document.getElementById('report-content');
            const loadingEl = document.getElementById('loading-state');
            contentEl.classList.add('hidden');
            loadingEl.classList.remove('hidden');
            loadingEl.innerHTML = `<p class="text-lg text-muted-foreground">Carregando dados do balanço...</p>`;
            
            try {
                const { valores, faltando, chaves } = resolveParams();
                if (faltando.length) {
                    throw new Error(`Parâmetro(s) do componente não configurado(s): ${faltando.join(', ')}. `
                        + `A plataforma expôs: ${chaves.join(', ') || '(nada)'}.`);
                }

                /* Uma consulta só. Antes havia uma segunda ("SELECT :VAR_MES")
                   apenas para descobrir a data de referência, e a tela morria
                   quando ela vinha vazia. A query corrigida já devolve
                   ANO_ATU, ANO_ANT e as datas usadas. */
                const reportResult = await queryMitra({ query: valores.queryDados });

                if (!reportResult || !reportResult.data) {
                    throw new Error("A consulta principal não retornou dados válidos.");
                }

                const headers = (reportResult.headers || []).map(h => (h && h.name ? h.name.toUpperCase() : ''));
                const col = n => headers.indexOf(n);
                const colMap = {
                    ordem: col('ORDEM'),
                    nomeGrupo: col('NOME_GRUPO'),
                    valorAtual: col('ANO_ATUAL'),
                    valorAnterior: col('ANO_ANTERIOR'),
                    anoAtu: col('ANO_ATU'),
                    anoAnt: col('ANO_ANT'),
                    dataInicio: col('DATA_INICIO_USADA'),
                    dataFim: col('DATA_FIM_USADA')
                };

                const ausentes = ['ordem', 'nomeGrupo', 'valorAtual', 'valorAnterior'].filter(k => colMap[k] === -1);
                if (ausentes.length) {
                    console.error('A query deve retornar ORDEM, NOME_GRUPO, ANO_ATUAL, ANO_ANTERIOR.', headers);
                    throw new Error(`A query configurada não retorna as colunas esperadas (faltou: ${ausentes.join(', ')}).`);
                }

                if (!reportResult.data.length) {
                    throw new Error("A consulta não retornou nenhuma linha. Verifique se a empresa "
                        + "selecionada tem balancete no período.");
                }

                const processedData = reportResult.data.map(row => {
                    return {
                        ordem: row[colMap.ordem] || '',
                        nomeGrupo: row[colMap.nomeGrupo] || 'N/A',
                        /* NULL fica NULL: e "sem cadastro no ano", nao zero */
                        valorAtual: toNumeroOuNulo(row[colMap.valorAtual]),
                        valorAnterior: toNumeroOuNulo(row[colMap.valorAnterior])
                    };
                });

                const primeira = reportResult.data[0];

                /* Se as datas nao chegaram, PARA. Antes a query caia em
                   CURDATE() em silencio e a tela mostrava o saldo de hoje e
                   de hoje-menos-1-ano como se fosse o periodo filtrado -
                   numero plausivel e errado, sem nenhum aviso. */
                const bruto = n => { const i = col(n); return i !== -1 ? primeira[i] : '(coluna ausente)'; };
                const cru = {
                    DATAS_OK: bruto('DATAS_OK'),
                    DATA_INICIO_USADA: bruto('DATA_INICIO_USADA'),
                    DATA_FIM_USADA: bruto('DATA_FIM_USADA'),
                    ANO_ATU: bruto('ANO_ATU'), ANO_ANT: bruto('ANO_ANT'),
                    LANC_EMPRESA: bruto('LANC_EMPRESA'), LANC_PERIODO: bruto('LANC_PERIODO')
                };
                console.log('[BP Interno] diagnostico da query:', cru);
                if (String(cru.DATAS_OK) === '0') {
                    throw new Error('O filtro de datas nao chegou a consulta. '
                        + 'DATAS_OK=' + cru.DATAS_OK
                        + ' | DATA_INICIO_USADA=' + cru.DATA_INICIO_USADA
                        + ' | DATA_FIM_USADA=' + cru.DATA_FIM_USADA
                        + ' | ANO_ATU=' + cru.ANO_ATU + ' | ANO_ANT=' + cru.ANO_ANT
                        + ' | LANC_EMPRESA=' + cru.LANC_EMPRESA
                        + ' | LANC_PERIODO=' + cru.LANC_PERIODO
                        + '  --  copie esta linha inteira.');
                }
                /* contadores de diagnostico: dizem POR QUE veio zerado */
                const iLancEmp = col('LANC_EMPRESA');
                const iLancPer = col('LANC_PERIODO');
                window.__DIAG = {
                    lancEmpresa: iLancEmp !== -1 ? Number(primeira[iLancEmp]) : null,
                    lancPeriodo: iLancPer !== -1 ? Number(primeira[iLancPer]) : null
                };
                const anoAtu = colMap.anoAtu !== -1 ? Number(primeira[colMap.anoAtu]) : null;
                const anoAnt = colMap.anoAnt !== -1 ? Number(primeira[colMap.anoAnt]) : null;
                const periodo = {
                    dataInicio: colMap.dataInicio !== -1 ? primeira[colMap.dataInicio] : '',
                    dataFim: colMap.dataFim !== -1 ? primeira[colMap.dataFim] : '',
                    anoAtu: anoAtu,
                    anoAnt: anoAnt
                };

                renderReport(processedData, anoAtu, anoAnt, periodo);
            } catch (error) {
                console.error("Falha ao carregar dados do balanço:", error);
                loadingEl.innerHTML = `<div class="p-8 text-center text-destructive-foreground bg-destructive h-full flex items-center justify-center rounded-lg">Erro Crítico: ${error.message}</div>`;
            }
        }
        function initializeComponent() {
            fetchAndRenderData();
        }
        document.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener(MITRA_UPDATE_EVENT_NAME, fetchAndRenderData);
            
            const waitForMitraAndInit = () => {
                const maxWaitTime = 5000;
                const intervalTime = 100;
                const startTime = Date.now();
                const checkInterval = setInterval(() => {
                    const { faltando } = resolveParams();
                    if (!faltando.length) {
                        clearInterval(checkInterval);
                        initializeComponent();
                    } else if (Date.now() - startTime > maxWaitTime) {
                        clearInterval(checkInterval);
                        const chaves = Object.keys(window.componentData || {});
                        console.error("Configurações do componente não carregadas. Faltou:", faltando, "| expostas:", chaves);
                        document.getElementById('report-container').innerHTML =
                            `<div class="p-8 text-center rounded-lg border border-border bg-secondary h-full flex items-center justify-center">
                                <div>
                                    <p class="text-base font-semibold text-destructive">Configuração do componente incompleta</p>
                                    <p class="mt-2 text-sm">Faltou: <span class="font-mono">${faltando.join(', ')}</span></p>
                                    <p class="mt-1 text-sm text-muted-foreground">A plataforma expôs: <span class="font-mono">${chaves.join(', ') || '(nada)'}</span></p>
                                </div>
                            </div>`;
                    }
                }, intervalTime);
            };

            waitForMitraAndInit();
        });
    </script>
</body>
</html>
