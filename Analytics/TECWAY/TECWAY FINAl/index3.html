
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório DRE</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%;
            --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96.1%;
            --secondary-foreground: 222.2 84% 4.9%;
            --muted: 210 40% 96.1%;
            --muted-foreground: 215.4 16.3% 46.9%;
            --accent: 210 40% 96.1%;
            --accent-foreground: 222.2 84% 4.9%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 210 40% 98%;
            --border: 214.3 31.8% 91.4%;
            --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%;
            --radius: 0.5rem;
        }
        .dark {
            --background: 222.2 84% 4.9%;
            --foreground: 210 40% 98%;
            --primary: 210 40% 98%;
            --primary-foreground: 222.2 47.4% 11.2%;
            --secondary: 217.2 32.6% 17.5%;
            --secondary-foreground: 210 40% 98%;
            --muted: 217.2 32.6% 17.5%;
            --muted-foreground: 215 20.2% 65.1%;
            --accent: 217.2 32.6% 17.5%;
            --accent-foreground: 210 40% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 210 40% 98%;
            --border: 217.2 32.6% 17.5%;
            --input: 217.2 32.6% 17.5%;
            --ring: 212.7 26.8% 83.9%;
        }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
    </style>
</head>
<body class="p-4 sm:p-6 lg:p-8">
    <div id="dre-container" class="h-full w-full flex flex-col">
        <div class="flex-grow overflow-auto">
            <table class="w-full border-collapse">
                <thead>
                    <tr class="border-b-2 border-foreground">
                        <th class="py-2 px-4 text-left text-base font-bold">Descrição</th>
                        <th class="py-2 px-4 text-left text-base font-bold">Nota</th>
                        <th id="header-current-year" class="py-2 px-4 text-right text-sm font-semibold w-32">...</th>
                        <th id="header-previous-year" class="py-2 px-4 text-right text-sm font-semibold w-32">...</th>
                    </tr>
                </thead>
                <tbody id="dre-tbody">
                    <tr>
                        <td colspan="4" class="text-center py-10 text-muted-foreground">Carregando dados...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        const MITRA_UPDATE_EVENT_DRE = 'mitra-update-dre-report';
        function updateMitra() {
            console.log("Sinal de update para [DRE Report] recebido. Disparando evento.");
            document.body.dispatchEvent(new CustomEvent(MITRA_UPDATE_EVENT_DRE));
        }
        document.addEventListener('DOMContentLoaded', () => {
            const tbody = document.getElementById('dre-tbody');
            const headerCurrentYearEl = document.getElementById('header-current-year');
            const headerPreviousYearEl = document.getElementById('header-previous-year');
            /* Valores completos e exatos. Antes havia um /1000 na leitura e
               arredondamento para inteiro aqui, ou seja a tela mostrava
               milhares. */
            function formatCurrency(value) {
                const num = Number(value);
                if (isNaN(num)) return '0,00';
                const formatted = new Intl.NumberFormat('pt-BR', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(Math.abs(num));
                return num < 0 ? `(${formatted})` : formatted;
            }
            /* NULL vindo da query significa "o ano desta coluna nao tem conta
               vinculada". Isso NAO e zero. Antes a tela fazia
               parseFloat(v) || 0 e mostrava 0, ou seja falta de cadastro
               passava por valor zero. */
            function isSemCadastro(v) {
                return v === null || v === undefined || v === '';
            }
            function toNumeroOuNulo(v) {
                if (isSemCadastro(v)) return null;
                const n = parseFloat(v);
                return isNaN(n) ? null : n;
            }
            /* celula: nulo mostra "sem cadastro"; subtotal incompleto leva * */
            function fmtValor(v, falta) {
                if (isSemCadastro(v)) {
                    return '<span class="text-muted-foreground italic" title="O ano desta coluna nao tem conta contabil vinculada nesta linha">sem cadastro</span>';
                }
                const base = formatCurrency(v);
                if (!falta) return base;
                return base + ' <span class="text-muted-foreground" title="' + falta + ' linha(s) deste grupo sem cadastro no ano - subtotal incompleto">*</span>';
            }
            /* soma subtotais propagando a contagem de linhas sem cadastro */
            function soma(...partes) {
                return partes.reduce((acc, p) => ({
                    atual: acc.atual + p.atual,
                    anterior: acc.anterior + p.anterior,
                    faltaAtual: acc.faltaAtual + (p.faltaAtual || 0),
                    faltaAnterior: acc.faltaAnterior + (p.faltaAnterior || 0)
                }), { atual: 0, anterior: 0, faltaAtual: 0, faltaAnterior: 0 });
            }
            function createRow(item, isBold = false, isTopBorder = false, isDoubleBorder = false, isSubtotal = false) {
                const row = document.createElement('tr');
                const boldClass = isBold ? 'font-bold' : '';
                const textColorClass = isSubtotal ? '' : 'text-muted-foreground';
                const bgClass = isSubtotal ? 'bg-secondary' : '';
                let borderClass = '';
                if(isDoubleBorder) {
                    borderClass = 'border-y-2 border-double border-foreground';
                } else if (isTopBorder) {
                    borderClass = 'border-t border-border';
                } else {
                    borderClass = 'border-b border-border';
                }
                row.innerHTML = `
                    <td class="py-2 px-4 text-sm ${boldClass} ${bgClass} ${borderClass}">${item.descricao || ''}</td>
                    <td class="py-2 px-4 text-sm ${boldClass} ${bgClass} ${borderClass}">${item.nota || ''}</td>
                    <td class="py-2 px-4 text-sm text-right tabular-nums ${boldClass} ${bgClass} ${borderClass}">${item.valor_atual !== undefined ? fmtValor(item.valor_atual, item.falta_atual) : ''}</td>
                    <td class="py-2 px-4 text-sm text-right tabular-nums ${boldClass} ${bgClass} ${borderClass}">${item.valor_anterior !== undefined ? fmtValor(item.valor_anterior, item.falta_anterior) : ''}</td>
                `;
                return row;
            }
            function createSpacerRow() {
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan="4" class="py-1"></td>`;
                return row;
            }
            async function loadAndRenderDRE() {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-10 text-muted-foreground">Carregando dados...</td></tr>';
                try {
                    if (!window.componentData || !componentData.query) {
                        throw new Error("Parâmetro 'query' do componente não configurado.");
                    }

                    /* Uma consulta só. Antes havia uma segunda
                       ("SELECT :VAR_MES FROM DUAL") apenas para descobrir o ano,
                       e a tela morria quando ela vinha vazia. A query corrigida
                       devolve ANO_ATU e ANO_ANT. */
                    const result = await queryMitra({ query: componentData.query });
                    if (!result || !result.data) {
                        throw new Error("A consulta não retornou dados válidos.");
                    }
                    if (!result.data.length) {
                        throw new Error("A consulta não retornou nenhuma linha. Verifique se a "
                            + "empresa selecionada tem balancete no período.");
                    }

                    const headers = result.headers.map(h => (h && h.name ? h.name.toUpperCase() : ''));
                    const colMap = {
                        hierarquia: headers.indexOf('HIERARQUIA'),
                        descricao: headers.indexOf('DESCRICAO'),
                        nota: headers.indexOf('NOTA'),
                        valor_atual: headers.indexOf('VALOR_ANO_ATUAL'),
                        valor_anterior: headers.indexOf('VALOR_ANO_ANTERIOR'),
                        anoAtu: headers.indexOf('ANO_ATU'),
                        anoAnt: headers.indexOf('ANO_ANT'),
                        dataInicio: headers.indexOf('DATA_INICIO_USADA'),
                        dataFim: headers.indexOf('DATA_FIM_USADA')
                    };
                    if (colMap.hierarquia === -1 || colMap.descricao === -1 || colMap.valor_atual === -1 || colMap.valor_anterior === -1) {
                        console.error('Mapeamento de colunas falhou. Headers recebidos:', headers);
                        throw new Error("A query não retornou as colunas esperadas: HIERARQUIA, DESCRICAO, VALOR_ANO_ATUAL, VALOR_ANO_ANTERIOR.");
                    }

                    const primeira = result.data[0];
                    const iLancEmp = headers.indexOf('LANC_EMPRESA');
                    const iLancPer = headers.indexOf('LANC_PERIODO');
                    const diag = {
                        lancEmpresa: iLancEmp !== -1 ? Number(primeira[iLancEmp]) : null,
                        lancPeriodo: iLancPer !== -1 ? Number(primeira[iLancPer]) : null
                    };
                    const currentYear = colMap.anoAtu !== -1 ? Number(primeira[colMap.anoAtu]) : new Date().getFullYear();
                    const previousYear = colMap.anoAnt !== -1 ? Number(primeira[colMap.anoAnt]) : currentYear - 1;
                    headerCurrentYearEl.textContent = currentYear;
                    headerPreviousYearEl.textContent = previousYear;

                    const data = result.data.map(row => ({
                        hierarquia: row[colMap.hierarquia],
                        descricao: row[colMap.descricao],
                        nota: colMap.nota !== -1 ? row[colMap.nota] : '',
                        /* NULL fica NULL, e os valores sao completos (sem /1000) */
                        valor_atual: toNumeroOuNulo(row[colMap.valor_atual]),
                        valor_anterior: toNumeroOuNulo(row[colMap.valor_anterior])
                    }));

                    /* Soma so o que tem cadastro, e CONTA o que nao tem. Tratar
                       "sem cadastro" como zero daria subtotal que parece
                       completo e nao e. */
                    const calculateSum = (prefix) => data
                        .filter(item => item.hierarquia && item.hierarquia.startsWith(prefix))
                        .reduce((acc, item) => ({
                            atual: acc.atual + (isSemCadastro(item.valor_atual) ? 0 : item.valor_atual),
                            anterior: acc.anterior + (isSemCadastro(item.valor_anterior) ? 0 : item.valor_anterior),
                            faltaAtual: acc.faltaAtual + (isSemCadastro(item.valor_atual) ? 1 : 0),
                            faltaAnterior: acc.faltaAnterior + (isSemCadastro(item.valor_anterior) ? 1 : 0)
                        }), { atual: 0, anterior: 0, faltaAtual: 0, faltaAnterior: 0 });
                    const receitas = calculateSum('1.');
                    const despesasOp = calculateSum('2.');
                    const resultadoFin = calculateSum('3.');
                    const lucroBruto = receitas;
                    const lucroAntesFin = soma(lucroBruto, despesasOp);
                    const lucroAntesImp = soma(lucroAntesFin, resultadoFin);
                    
                    tbody.innerHTML = '';
                    const fragment = document.createDocumentFragment();
                    const hiddenDescriptionsFromData = ['(+) ADIÇÕES', '(-) EXCLUSÕES'];
                    // 1. Receitas
                    fragment.appendChild(createRow({ descricao: 'Receitas' }, true));
                    data.filter(i => i.hierarquia.startsWith('1.')).forEach(item => fragment.appendChild(createRow(item)));
                    fragment.appendChild(createRow({ descricao: 'Lucro bruto', valor_atual: lucroBruto.atual, valor_anterior: lucroBruto.anterior, falta_atual: lucroBruto.faltaAtual, falta_anterior: lucroBruto.faltaAnterior }, true, true, false, true));
                    fragment.appendChild(createSpacerRow());
                    // 2. Despesas Operacionais
                    fragment.appendChild(createRow({ descricao: 'Despesas operacionais' }, true));
                    data.filter(i => i.hierarquia.startsWith('2.')).forEach(item => fragment.appendChild(createRow(item)));
                    fragment.appendChild(createRow({ descricao: '', valor_atual: despesasOp.atual, valor_anterior: despesasOp.anterior, falta_atual: despesasOp.faltaAtual, falta_anterior: despesasOp.faltaAnterior }, false, true, false, true));
                    fragment.appendChild(createRow({ descricao: 'Lucro antes do resultado financeiro', valor_atual: lucroAntesFin.atual, valor_anterior: lucroAntesFin.anterior, falta_atual: lucroAntesFin.faltaAtual, falta_anterior: lucroAntesFin.faltaAnterior }, true));
                    fragment.appendChild(createSpacerRow());
                    // 3. Resultado Financeiro
                    data.filter(i => i.hierarquia.startsWith('3.')).forEach(item => fragment.appendChild(createRow(item)));
                    fragment.appendChild(createRow({ descricao: 'Resultado financeiro', valor_atual: resultadoFin.atual, valor_anterior: resultadoFin.anterior, falta_atual: resultadoFin.faltaAtual, falta_anterior: resultadoFin.faltaAnterior }, true, true, false, true));
                    fragment.appendChild(createSpacerRow());
                    // 4. Impostos e Lucro do Exercício
                    fragment.appendChild(createRow({ descricao: 'Lucro antes dos impostos', valor_atual: lucroAntesImp.atual, valor_anterior: lucroAntesImp.anterior, falta_atual: lucroAntesImp.faltaAtual, falta_anterior: lucroAntesImp.faltaAnterior }, true));
                    data
                        .filter(i => 
                            i.hierarquia.startsWith('4.') && 
                            !hiddenDescriptionsFromData.includes((i.descricao || '').toUpperCase())
                        )
                        .forEach(item => fragment.appendChild(createRow(item)));
                    fragment.appendChild(createSpacerRow());
                    const totalImpostos = calculateSum('4.');
                    const lucroDoExercicio = soma(lucroAntesImp, totalImpostos);
                    fragment.appendChild(createRow({ 
                        descricao: 'Lucro do exercício', 
                        valor_atual: lucroDoExercicio.atual, 
                        valor_anterior: lucroDoExercicio.anterior, falta_atual: lucroDoExercicio.faltaAtual, falta_anterior: lucroDoExercicio.faltaAnterior 
                    }, true, false, true, true));
                    /* Aviso de falta de cadastro: sem ele, uma coluna inteira
                       em branco parece "empresa sem movimento". */
                    if (diag.lancEmpresa === 0) {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td colspan="4" class="pt-6"><div class="rounded-lg border border-destructive bg-secondary p-4 text-sm text-left">
                            <span class="font-semibold text-destructive">Nenhum lan\u00e7amento encontrado para a empresa selecionada.</span>
                            Os valores v\u00eam zerados por isso, n\u00e3o por falta de cadastro. Confira se o par\u00e2metro
                            <span class="font-mono">varEmpresa</span> = <span class="font-mono">:VAR_EMPRESA_DRE</span>
                            est\u00e1 declarado na configura\u00e7\u00e3o do componente \u2014 a plataforma s\u00f3 substitui
                            <span class="font-mono">:VAR_*</span> que esteja declarado. Esta tela n\u00e3o tinha esse par\u00e2metro.
                            </div></td>`;
                        fragment.appendChild(tr);
                    } else if (diag.lancPeriodo === 0 && diag.lancEmpresa > 0) {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td colspan="4" class="pt-6"><div class="rounded-lg border border-border bg-secondary p-4 text-sm text-left">
                            <span class="font-semibold">A empresa tem balancete, mas nada no per\u00edodo filtrado.</span>
                            ${diag.lancEmpresa} lan\u00e7amentos no total, nenhum entre as datas escolhidas.
                            </div></td>`;
                        fragment.appendChild(tr);
                    }

                    const semAtu = data.filter(d => isSemCadastro(d.valor_atual)).length;
                    const semAnt = data.filter(d => isSemCadastro(d.valor_anterior)).length;
                    if (semAtu || semAnt) {
                        const partes = [];
                        if (semAtu) partes.push(`<b>${semAtu}</b> de ${data.length} linha(s) sem conta contábil vinculada no ano <b>${currentYear}</b>`);
                        if (semAnt) partes.push(`<b>${semAnt}</b> de ${data.length} linha(s) sem conta contábil vinculada no ano <b>${previousYear}</b>`);
                        const aviso = document.createElement('tr');
                        aviso.innerHTML = `<td colspan="4" class="pt-6">
                            <div class="rounded-lg border border-border bg-secondary p-4 text-sm text-left">
                                <span class="font-semibold">Cadastro do ano incompleto:</span>
                                ${partes.join(' e ')}.
                                Essas linhas aparecem como <span class="italic">sem cadastro</span> — não como zero —
                                e os subtotais que as incluem levam <span class="font-semibold">*</span>,
                                porque não estão completos.
                            </div></td>`;
                        fragment.appendChild(aviso);
                    }

                    tbody.appendChild(fragment);
                } catch (error) {
                    console.error("Erro ao carregar DRE:", error);
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-10 text-destructive-foreground bg-destructive rounded-md">Falha ao carregar os dados. ${error.message}</td></tr>`;
                }
            }
            document.body.addEventListener(MITRA_UPDATE_EVENT_DRE, loadAndRenderDRE);
            const initializeComponent = () => {
                loadAndRenderDRE();
            };
            const waitForMitraAndInit = () => {
                const maxWaitTime = 5000;
                const intervalTime = 100;
                const startTime = Date.now();
                const checkInterval = setInterval(() => {
                    /* So a query e obrigatoria. As datas e a empresa NAO
                       precisam de parametro no componente: a plataforma resolve
                       :VAR_DATA_INICIO, :VAR_DATA_FIM e :VAR_EMPRESA_DRE direto
                       no texto da query. O varMes so existia por causa da
                       segunda consulta, que foi removida. */
                    if (window.componentData && window.componentData.query) {
                        clearInterval(checkInterval);
                        initializeComponent();
                    } else if (Date.now() - startTime > maxWaitTime) {
                        clearInterval(checkInterval);
                        console.error("Erro: As configurações do componente (componentData) não foram carregadas a tempo.");
                        document.getElementById('dre-container').innerHTML = `<div class="p-8 text-center text-red-700 bg-red-50 h-full flex items-center justify-center rounded-md">Erro Crítico: As configurações do componente não foram carregadas da plataforma.</div>`;
                    }
                }, intervalTime);
            };
            waitForMitraAndInit();
        });
    </script>
</body>
</html>
